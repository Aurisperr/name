<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="color-scheme" content="dark">
<title></title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden;background:#04060a}
  #stage{position:fixed;inset:0;overflow:hidden;background:#04060a}
  #gl{position:absolute;inset:0;width:100%;height:100%;display:block;
      cursor:crosshair;touch-action:none}
  #boot{position:absolute;inset:0;z-index:20;background:#04060a;
        display:grid;place-items:center;transition:opacity .45s ease}
  #boot i{display:block;width:86px;height:1px;
        background:linear-gradient(90deg,rgba(255,208,158,0),rgba(255,208,158,.55),rgba(255,208,158,0));
        animation:bl 1.8s ease-in-out infinite}
  @keyframes bl{0%,100%{opacity:.12;transform:scaleX(.45)}50%{opacity:.85;transform:scaleX(1)}}
  #boot.gone{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <div id="boot"><i></i></div>
</div>
<canvas id="ink" style="display:none"></canvas>

<script>
"use strict";
/* ==================================================================
   TIDAL ECHO
   night beach · write in the sand · the tide keeps no record
   WebGL · no external assets · no text
   ================================================================== */

/* ==================================================================
   1. SHADERS
   ================================================================== */
var VS_SRC = [
"attribute vec2 aPos;",
"varying vec2 vUv;",
"void main(){ vUv=aPos*0.5+0.5; gl_Position=vec4(aPos,0.0,1.0); }"
].join("\n");

/* shared GLSL : noise + THE wave (scene and erosion must agree on it) */
var LIB = [
"precision highp float;",
"float hash11(float p){ p=fract(p*0.1031); p*=p+33.33; p*=p+p; return fract(p); }",
"float hash21(vec2 p){ vec3 q=fract(vec3(p.xyx)*0.1031); q+=dot(q,q.yzx+33.33); return fract((q.x+q.y)*q.z); }",
"float vnoise(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.0-2.0*f);",
"  return mix(mix(hash21(i),hash21(i+vec2(1.0,0.0)),f.x),",
"             mix(hash21(i+vec2(0.0,1.0)),hash21(i+vec2(1.0,1.0)),f.x),f.y); }",
"float fbm(vec2 p){ float a=0.5,s=0.0; for(int i=0;i<5;i++){ s+=a*vnoise(p); p*=2.03; a*=0.5; } return s; }",
"float fbm3(vec2 p){ float a=0.5,s=0.0; for(int i=0;i<3;i++){ s+=a*vnoise(p); p*=2.07; a*=0.5; } return s; }",
"float fbm2(vec2 p){ float s=0.5*vnoise(p); s+=0.25*vnoise(p*2.07); return s*1.34; }",
/* the single wave that moves the tide line, shapes the sun and breaks its light */
"float waveShape(float x,float t){",
"  return sin(x*13.5+t*2.05)*0.42 + sin(x*34.2-t*3.15)*0.24",
"       + sin(x*7.2+t*1.15)*0.50 + sin(x*81.0+t*5.20)*0.10; }",
"float waveY(float x,float base,float amp,float t){ return base+waveShape(x,t)*amp; }"
].join("\n");

/* ---------- SCENE ---------- */
/* ---------- SCENE ---------- */
var SCENE_SRC = LIB + [
"varying vec2 vUv;",
"uniform vec2  uRes;",
"uniform float uTime, uTide, uWave, uCharge, uFlash, uWet, uHint, uMark;",
"uniform float uShore, uMax, uHorizon;",
"uniform vec2  uSun;",
"uniform vec4  uBox;",
"uniform sampler2D uInk, uEro;",
"uniform vec2  uMouse;",
"uniform float uMouseOn;",

"vec2 boxUv(vec2 uv){ return (uv-uBox.xy)/uBox.zw; }",
"float inkAt(vec2 uv){ vec2 t=boxUv(uv);",
"  if(t.x<0.0||t.x>1.0||t.y<0.0||t.y>1.0) return 0.0;",
"  return texture2D(uInk,t).a; }",
"float eroAt(vec2 uv){ vec2 t=boxUv(uv);",
"  if(t.x<0.0||t.x>1.0||t.y<0.0||t.y>1.0) return 0.0;",
"  return texture2D(uEro,t).r; }",

/* ==================================================================
   THE SUN : a body of the same water as the sea.
   Its strata are the wave field seen edge on, so the sun, the swell
   and the ripples on the sand all speak one visual language.
   ================================================================== */
"vec3 sunBody(vec2 uv,float t){",
"  vec2 p=(uv-uSun)*vec2(uRes.x/uRes.y,1.0);",
"  float R=0.088;",
"  float d=length(p);",
"  float wv=waveShape(p.x*2.0+uSun.x*3.0,t*0.80);",
"  float edge=R*(1.0+0.040*wv);",
"  float disc=1.0-smoothstep(edge-0.020,edge+0.004,d);",
"  float k=clamp(d/edge,0.0,1.0);",
"  float ny=clamp(p.y/edge,-1.0,1.0);",
"  float lat=asin(clamp(ny,-1.0,1.0));",
"  float v=ny*0.5+0.5;",
/* --- the ball : a hot core, a limb that falls away, a lit rim --- */
"  float core=pow(max(1.0-k*k,0.0),0.40);",
"  vec3 hot=vec3(0.95,0.20,0.40);",
"  vec3 bodyc=vec3(0.90,0.05,0.24);",
"  vec3 deep=vec3(0.46,0.01,0.13);",
"  vec3 c=mix(deep,bodyc,smoothstep(0.0,0.45,core));",
"  c=mix(c,hot,smoothstep(0.55,1.0,core));",
/* an off centre glow, the way a sphere catches its own light */
"  float spec=exp(-length(p-vec2(-0.22*edge,0.26*edge))/(edge*0.42));",
"  c+=vec3(1.0,0.22,0.44)*spec*0.34*core;",
/* --- the wave strata follow the latitude, so they curve like a sphere --- */
"  float vh=clamp((uHorizon-(uSun.y-R))/(2.0*R),0.0,1.0);",
"  float fr=fract((lat*2.1-wv*0.020)*20.0+0.5);",
"  float slit=1.0-smoothstep(0.0,0.12,min(fr,1.0-fr));",
"  float depth=0.78*exp(-pow((v-vh)/0.40,2.0));",
"  c*=1.0-slit*depth;",
"  float crest=1.0-smoothstep(0.0,0.05,abs(fr-0.5));",
"  c+=vec3(1.0,0.30,0.58)*crest*0.16*exp(-pow((v-vh)/0.40,2.0));",
/* a granular surface : it is made of water, not printed on a disc */
"  float grain=0.5;",
"  if(d<edge*1.2) grain=fbm2(p*46.0+vec2(0.0,t*0.22));",
"  c*=0.86+0.28*grain;",
/* the foot of the sun is eaten by the swell */
"  float melt=1.0-smoothstep(-1.00,-0.30,ny);",
"  float eat=smoothstep(-0.30,0.30,waveShape(p.x*3.4+4.0,t*1.05));",
"  float erode=clamp(melt*(0.40+0.95*eat),0.0,1.0);",
"  float a=disc*(1.0-erode*0.94);",
/* --- the fresnel rim of a glowing sphere --- */
"  float fres=pow(k,2.6);",
"  c+=vec3(0.35,0.80,1.0)*fres*0.20;",
"  c+=vec3(1.0,0.40,0.76)*fres*0.30;",
"  c*=0.66;",
/* thin drifting filaments that draw the contour of the sun */
"  float dl=0.0;",
"  if(d<edge*1.7){",
"  for(int i=0;i<3;i++){",
"    float fi=float(i);",
"    float ly=uSun.y+(0.030+fi*0.046)+sin(t*0.11+fi*2.1)*0.005;",
"    float wob=waveShape(uv.x*3.0+fi*1.7,t*0.5)*0.009;",
"    dl+=exp(-pow((uv.y-ly-wob)/0.0010,2.0));",
"  }",
"  }",
"  c+=vec3(1.0,0.42,0.78)*dl*0.10*disc;",
"  c*=1.0-0.10*dl*disc;",
/* limb and a soft spreading light */
"  float rim=exp(-pow((d-edge*0.99)/(edge*0.070),2.0));",
"  vec3 warm=vec3(1.0,0.16,0.36);",
"  float glow=exp(-max(d-edge,0.0)*9.0);",
"  float glow2=exp(-max(d-edge,0.0)*30.0);",
"  float air=exp(-d*2.4);",
"  vec3 halo=warm*glow*0.055+vec3(0.40,0.80,1.0)*glow2*0.032+warm*air*0.028;",
"  return c*a+rim*vec3(0.40,0.88,1.0)*0.30+halo;",
"}",

/* the light column breathes with the same swell that moves the tide */
"float swellPulse(vec2 uv,float t,float dep){",
"  float ph=waveShape(uv.x*1.6+2.0,t*0.85);",
"  float beat=0.5+0.5*sin(dep*17.0-t*2.1+ph*1.8);",
"  float crest=smoothstep(-0.25,0.55,ph);",
"  return (0.26+0.92*beat)*(0.46+0.80*crest);",
"}",

/* ---- the glitter path : the sun's own swell, laid on the water ---- */
"float sunPath(vec2 uv,float t,float dep){",
"  float pw=0.016+dep*0.24;",
"  float dx=abs(uv.x-uSun.x);",
"  float inPath=1.0-smoothstep(pw*0.28,pw,dx);",
"  if(inPath<=0.0) return 0.0;",
"  float cellS=0.0075+dep*0.055;",
"  vec2 q=vec2(dx/cellS,(dep*dep*3.4+dep*0.60)/cellS);",
"  q.x=q.x+waveShape(uv.x*1.7,t*0.9)*0.30;",
"  vec2 cell=floor(q);",
"  vec2 cf=fract(q)-0.5;",
"  float h=hash21(cell);",
"  vec2 jit=vec2(hash21(cell+3.1),hash21(cell+7.7))-0.5;",
"  float d=length(cf-jit*0.70);",
"  float sp=1.0-smoothstep(0.07,0.23,d);",
"  float on=step(0.70,h);",
"  float amp=smoothstep(0.0,0.010,dep);",
"  return sp*on*amp*inPath*(0.25+0.90*hash11(cell.y*2.7+1.0));",
"}",,

/* a dot matrix display : only round pixels, never any letter */
"float dotMatrix(vec2 p,float cell,float seed){",
"  vec2 g=floor(p/cell);",
"  vec2 f=fract(p/cell)-0.5;",
"  float on=step(0.56,hash21(vec2(g.x+seed*7.0,g.y-floor(uTime*2.6))));",
"  return (1.0-smoothstep(0.13,0.30,length(f)))*on;",
"}",
/* the neon frame of a panel */
"float rectFrame(vec2 p,vec2 lo,vec2 hi,float w){",
"  vec2 d=min(p-lo,hi-p);",
"  float e=min(d.x,d.y);",
"  float inr=step(0.0,d.x)*step(d.y,0.0);",
"  return inr*(1.0-smoothstep(0.0,w,e));",
"}",

/* the rain landing on a surface : a ring that opens and a small flash */
,

/* low saturation horizontal strata, textured like old film stock */
"vec3 skyBands(vec2 uv,float t){",
"  vec3 c=vec3(0.0);",
"  for(int L=0;L<3;L++){",
"    float fl=float(L);",
"    float yb=uHorizon+0.030+fl*0.082;",
"    float th=0.014+fl*0.011;",
"    float n=fbm3(vec2(uv.x*4.5+fl*13.0+t*0.005,fl*3.0));",
"    float band=smoothstep(0.40,0.86,n);",
"    float prof=exp(-pow((uv.y-yb)/th,2.0));",
"    float tex=0.72+0.28*fbm2(vec2(uv.x*46.0+fl*7.0,uv.y*130.0));",
"    c+=vec3(0.052,0.060,0.082)*band*prof*tex*(1.0-fl*0.18);",
"  }",
"  return c;",
"}",
"float sunShafts(vec2 uv,float t){",
"  vec2 p=(uv-uSun)*vec2(uRes.x/uRes.y,1.0);",
"  float d=length(p);",
"  float a=atan(p.y,p.x);",
"  float s=0.0;",
"  for(int i=0;i<4;i++){",
"    float fi=float(i);",
"    float ang=hash11(fi*3.7+1.0)*6.2831+sin(t*0.035+fi*1.7)*0.10;",
"    float wdt=0.035+0.030*hash11(fi*5.1+2.0);",
"    s+=exp(-pow((a-ang)/wdt,2.0))*(0.55+0.45*hash11(fi*7.3+3.0));",
"  }",
"  float cut=1.0-smoothstep(0.075,0.108,d);",
"  return s*exp(-d*2.2)*cut;",
"}",
"vec3 dustMotes(vec2 uv,float t){",
"  vec3 e=vec3(0.0);",
"  for(int L=0;L<2;L++){",
"    float fl=float(L);",
"    float sc=38.0+fl*44.0;",
"    vec2 g=uv*vec2(uRes.x/uRes.y,1.0)*sc;",
"    g.x=g.x+t*(0.09+fl*0.07);",
"    g.y=g.y+t*0.025;",
"    vec2 cell=floor(g);",
"    vec2 cf=fract(g)-0.5;",
"    float on=step(0.9935-fl*0.003,hash21(cell));",
"    float dp=1.0-smoothstep(0.02,0.10,length(cf));",
"    float fade=smoothstep(uHorizon-0.03,uHorizon+0.26,uv.y)*(1.0-smoothstep(uHorizon+0.30,uHorizon+0.60,uv.y));",
"    e+=mix(vec3(1.0,0.52,0.78),vec3(0.58,0.84,1.0),fl)*on*dp*fade*(0.50-fl*0.16);",
"  }",
"  return e;",
"}",
"vec3 cloudStrata(vec2 uv,float t){",
"  vec3 c=vec3(0.0);",
"  float azx=exp(-pow((uv.x-uSun.x)/0.45,2.0));",
"  for(int L=0;L<2;L++){",
"    float fl=float(L);",
"    float yb=uHorizon+0.085+fl*0.185;",
"    float n=fbm3(vec2(uv.x*2.8+fl*9.0+t*0.010,fl*5.0+t*0.004));",
"    float band=smoothstep(0.44,0.86,n)*exp(-pow((uv.y-yb)/(0.055+fl*0.03),2.0));",
"    vec3 cc=mix(vec3(0.020,0.038,0.070),vec3(0.160,0.058,0.118),azx);",
"    c+=cc*band*(1.0-fl*0.30)*1.7;",
"  }",
"  return c;",
"}",

/* ==================================================================
   THE SKYLINE : boxes with volume, setbacks, windows, neon and haze
   ================================================================== */
"vec4 cityLayer(vec2 uv,float t){",
"  vec3 em=vec3(0.0);",
"  vec3 emAdd=vec3(0.0);",
"  vec3 col=vec3(0.0);",
"  float has=0.0;",
"  for(int i=0;i<5;i++){",
"    float fl=4.0-float(i);",
"    if(uv.y>=uHorizon-0.003&&uv.y<=uHorizon+0.34){",
"    float dens=5.0+fl*4.2;",
"    float c=floor(uv.x*dens);",
"    float bxc=fract(uv.x*dens);",
"    float r1=hash11(c*7.7+fl*5.0+3.0);",
"    float r2=hash11(c*2.3+fl*11.0+7.0);",
"    float r3=hash11(c*13.7+fl*2.0+1.0);",
"    float r4=hash11(c*31.1+fl*3.0+9.0);",
"    float azx=exp(-pow((uv.x-uSun.x)/0.45,2.0));",
"    float kind=hash11(c*17.3+fl*2.0);",
"    float bw=0.30+0.62*pow(r3,1.3);",
"    float bx=0.01+(1.0-bw)*(0.05+0.85*r4);",
"    float inX=step(bx,bxc)*step(bxc,bx+bw);",
"    float u=(bxc-bx)/max(bw,0.001);",
"    float cluster=0.40+0.60*hash11(floor(c/3.0)*3.9+fl*7.0);",
/* the near towers are immense, the far ones are low */
"    float hgt=(0.006+fl*0.004)+pow(r1,1.5)*(0.026+0.078*(1.0-fl*0.15))*cluster;",
"    hgt=hgt+step(0.70,kind)*(0.055+0.120*r3);",
"    hgt=hgt*(1.0-0.45*step(0.30,kind)*step(0.55,kind));",
/* a stepped setback : a narrower tower standing on the roof */
"    float su=step(0.24,u)*step(u,0.76);",
"    float spireH=step(0.76,r2)*(0.018+0.062*r3);",
"    float roof=uHorizon+hgt;",
/* machinery on the roof : the skyline is never a flat line */
"    float gb=floor(bxc*9.0);",
"    float gh=hash11(gb*2.9+c*13.0+fl*5.0);",
"    float greeb=step(0.50,gh)*0.004+step(0.78,gh)*0.009+step(0.92,gh)*0.017;",
"    float bodyTop=roof+spireH*su+greeb;",
"    float dep=1.0-fl*0.19;",
"    float bcx=(c+bx+bw*0.5)/dens;",
/* the antenna and its beacon */
"    float mast=step(0.90,r1)*(1.0-smoothstep(0.0004,0.0008,abs(uv.x-bcx)))",
"                *step(bodyTop-0.001,uv.y)*step(uv.y,bodyTop+0.010);",
"    emAdd+=vec3(0.45,0.20,0.30)*mast*0.40;",
"    float bl=1.0-smoothstep(0.0009,0.0016,length((vec2(uv.x,uv.y)-vec2(bcx,bodyTop+0.009))*vec2(1.0,0.30)));",
"    emAdd+=vec3(1.0,0.20,0.34)*bl*step(0.90,r1)*(0.15+0.85*step(0.5,sin(t*2.4+r2*6.0)));",
"    float inside=inX*step(uHorizon-0.0020,uv.y)*step(uv.y,bodyTop);",
"    if(inside>0.5){",
/* the mass : almost black, the city is a silhouette */
"      float side=smoothstep(0.84,0.90,u);",
"      vec3 base=mix(vec3(0.011,0.014,0.028),vec3(0.003,0.004,0.010),dep);",
"      base=mix(base,base*vec3(2.0,1.0,1.5),side*0.55);",
/* the structural ribs : a tower is not a slab */
"      float rib=0.42+0.58*step(0.36,fract(u*3.0+0.25));",
"      base=base*rib;",
/* the rim light the city throws on the corners */
"      float edge=0.0;",
"      edge+=(1.0-smoothstep(0.0,0.009,abs(u-0.014)));",
"      edge+=(1.0-smoothstep(0.0,0.009,abs(u-0.986)));",
"      em+=vec3(0.40,0.24,0.34)*edge*dep*0.28;",
"      float hz=smoothstep(0.0,0.016,uv.y-uHorizon);",
"      base=mix(vec3(0.012,0.016,0.030),base,hz);",
"      col=base; has=1.0;",
/* the windows : small, sparse, warm */
"      float fr=(bodyTop-uv.y)/0.0060;",
"      vec2 wc=floor(vec2(u*11.0,fr));",
"      float wu=fract(u*11.0), wvv=fract(fr);",
"      float glass=step(0.26,wu)*step(wu,0.68)*step(0.28,wvv)*step(wvv,0.68)*(1.0-side);",
"      float inner=step(0.34,wu)*step(wu,0.60)*step(0.36,wvv)*step(wvv,0.60);",
"      float mull=glass-inner;",
"      em+=vec3(0.030,0.058,0.105)*glass*0.32*dep;",
"      em+=mix(vec3(0.24,0.17,0.21),vec3(0.15,0.20,0.30),azx)*mull*0.14*dep;",
"      float lit=step(0.905,hash21(wc+c*31.0+fl*7.0));",
"      float flk=0.60+0.40*sin(t*(0.5+hash11(wc.y*3.1+c))*2.6);",
"      vec3 wcol=mix(vec3(1.0,0.42,0.62),vec3(0.45,0.82,1.0),step(0.66,hash21(wc*1.7+c*5.0+fl)));",
"      em+=wcol*inner*lit*flk*0.170*dep;",
/* a few rooms are still awake */
"      float story=step(0.968,hash21(wc*3.1+c*7.0+fl*2.0));",
"      float n2=hash11(wc.y*2.3+c*11.0+fl);",
"      float awake=step(0.34,fract(t*(0.05+n2*0.18)+n2*9.0));",
"      em+=vec3(1.0,0.58,0.70)*inner*story*awake*0.30*dep;",
/* a thin neon tube running down the flank */
"      float tube=step(0.55,r2)*(1.0-smoothstep(0.0009,0.0019,abs(u-0.90)))",
"                *step(uHorizon,uv.y)*step(uv.y,bodyTop);",
"      em+=mix(vec3(1.0,0.32,0.55),vec3(0.24,0.84,1.0),step(0.5,r3))*tube*dep*0.55;",
"    }",
"    }",
"  }",
"  if(has<0.5) return vec4(emAdd*0.8,0.0);",
"  return vec4(col+em+emAdd,1.0);",
"}",,

/* ---- two aircraft, blinking ---- */
"vec3 airTraffic(vec2 uv,float t){",
"  vec3 e=vec3(0.0);",
"  for(int L=0;L<2;L++){",
"    float fl=float(L);",
"    float sp=0.010+0.024*hash11(fl*3.3+1.0);",
"    float dir=1.0;",
"    if(hash11(fl*7.7+2.0)<=0.5){ dir=-1.0; }",
"    float x=fract(uv.x+dir*t*sp+hash11(fl*5.5+3.0));",
"    float y=uHorizon+0.022+fl*0.034+hash11(fl*9.1)*0.010;",
"    vec2 dp=(uv-vec2(x,y))*vec2(1.0,3.4);",
"    float dotp=1.0-smoothstep(0.0,0.0030,length(dp));",
"    float blink=step(0.45,sin(t*(2.2+fl)+fl*3.0));",
"    e+=mix(vec3(1.0,0.36,0.70),vec3(0.34,0.82,1.0),hash11(fl*11.0))*dotp*blink*0.60;",
"  }",
"  return e;",
"}",

/* ---- overhead cables (silhouette) and a few dim lamps ---- */
"vec4 powerLines(vec2 uv,float t){",
"  float mask=0.0; vec3 lamp=vec3(0.0);",
"  for(int L=0;L<2;L++){",
"    float fl=float(L);",
"    float yb=uHorizon+0.088+fl*0.030;",
"    float sag=0.019+fl*0.009;",
"    float u=uv.x-0.5;",
"    float yy=yb-sag*(1.0-4.0*u*u);",
"    mask=max(mask,1.0-smoothstep(0.0,0.0009,abs(uv.y-yy)));",
"    float N=10.0+fl*4.0;",
"    float idx=floor(uv.x*N);",
"    float lx=(idx+0.5)/N;",
"    float lu=lx-0.5;",
"    float ly=yb-sag*(1.0-4.0*lu*lu)-0.0070;",
"    float hsh=hash11(idx*3.7+fl*11.0);",
"    float rate=0.22+0.45*hsh;",
"    float blink=step(0.34+0.44*hsh,fract(t*rate+hsh*5.0));",
"    vec3 lc=mix(vec3(1.0,0.34,0.70),vec3(0.30,0.80,1.0),step(0.70,hsh));",
"    float ld=length((uv-vec2(lx,ly))*vec2(uRes.x/uRes.y,1.0));",
"    lamp+=lc*(1.0-smoothstep(0.0008,0.0026,ld))*blink*0.70;",
"    lamp+=lc*exp(-ld*260.0)*blink*0.28;",
"  }",
"  return vec4(mask,lamp);",
"}",

/* ---- sand : albedo only, lit later ---- */
"vec3 sandAt(vec2 uv,float px,float wet){",
"  float d=uShore-uv.y;",
"  vec3 dry=mix(vec3(0.225,0.215,0.235),vec3(0.125,0.120,0.145),smoothstep(0.0,0.50,d));",
"  vec3 wetc=mix(vec3(0.090,0.088,0.110),vec3(0.040,0.044,0.062),smoothstep(0.0,0.50,d));",
"  vec3 c=mix(dry,wetc,wet);",
"  float n=fbm3(uv*vec2(160.0,160.0));",
"  c+=(n-0.5)*0.034;",
"  c+=(hash21(floor(uv*uRes*0.7))-0.5)*0.020;",
/* wind ripples : the same wave rhythm, in perspective */
"  float persp=1.0/(0.30+d*3.4);",
"  float rip=sin(uv.y*persp*120.0+waveShape(uv.x*2.0,uv.y*40.0)*2.2+fbm2(uv*vec2(4.0,8.0))*9.0);",
"  c+=vec3(0.90,0.86,0.80)*smoothstep(0.50,1.0,rip)*0.034;",
"  c+=vec3(1.0,0.52,0.82)*smoothstep(0.86,1.0,rip)*0.16*wet;",
"  c*=1.0-0.042*(1.0-smoothstep(0.0,0.95,rip));",
/* mica : a few grains catching the light */
"  float spk=step(0.9988,hash21(floor(uv*uRes*0.9)));",
"  c+=vec3(1.0,0.62,0.92)*spk*0.22;",
"  return c; }",

/* ---- the hand written groove in the sand ---- */
"float sandH(vec2 uv){ return -inkAt(uv)*(1.0-eroAt(uv)); }",
"vec3 writeInk(vec3 sand,vec2 uv,vec2 L,out float bloom){",
"  float g=inkAt(uv)*(1.0-eroAt(uv));",
"  float lip=inkAt(uv+L)*(1.0-eroAt(uv+L));",
"  float lipB=inkAt(uv-L*1.35)*(1.0-eroAt(uv-L*1.35));",
"  float skirt=(inkAt(uv+L*3.2)+inkAt(uv-L*3.2)+inkAt(uv+vec2(L.x*4.4,0.0))+inkAt(uv-vec2(L.x*4.4,0.0)))*0.25;",
"  bloom=skirt*(1.0-eroAt(uv))*(0.30+0.85*uCharge);",
"  sand*=1.0-0.34*g;",
"  sand*=1.0-0.18*max(lipB-g,0.0);",
"  sand+=vec3(1.0,0.40,0.64)*0.30*max(lip-g,0.0);",
"  sand+=vec3(1.0,0.22,0.60)*bloom*0.16*uCharge;",
"  return sand; }",

/* ---- lighting helpers ---- */
"vec3 sandLight(vec3 albedo,float lit,float wet){",
"  vec3 amb=vec3(0.20,0.32,0.58)*(0.82+wet*0.55);",
"  vec3 dir=vec3(1.38,0.13,0.46)*lit;",
"  return albedo*(amb+dir); }",

/* ==================================================================
   SMALL LIFE ON THE SAND : crabs, with soft shadows and motion smear
   ================================================================== */


/* ---- a faint trace that shows the sand can be written on ---- */
"float hintTrace(vec2 uv,float t){",
"  float p=clamp((t-1.5)/3.4,0.0,1.0);",
"  float fade=1.0-smoothstep(5.2,8.6,t);",
"  if(fade<=0.0) return 0.0;",
"  float y=uShore-0.070+sin((uv.x-0.5)*11.0)*0.013;",
"  float line=1.0-smoothstep(0.0,0.0032,abs(uv.y-y));",
"  float drawn=1.0-smoothstep(p-0.03,p+0.03,uv.x);",
"  float region=smoothstep(0.16,0.21,uv.x)*(1.0-smoothstep(0.80,0.85,uv.x));",
"  float head=exp(-pow((uv.x-mix(0.18,0.82,p))/0.022,2.0));",
"  return (line*drawn*region*0.50+line*head*region*0.85)*fade;",
"}",

/* ---- a huge holographic projection on a steel truss, in front of the city ---- */
/* ---- a gantry : a steel truss bridging the whole skyline ---- */
"vec3 gantry(vec2 uv,float t){",
"  vec3 c=vec3(0.0);",
"  float x0=0.02,x1=0.99;",
"  float y=uHorizon+0.088;",
"  if(uv.x<x0||uv.x>x1) return c;",
"  float u=(uv.x-x0)/(x1-x0);",
"  float m=step(x0,uv.x)*step(uv.x,x1);",
"  float ch=1.0-smoothstep(0.0,0.0026,abs(uv.y-y));",
"  ch+=1.0-smoothstep(0.0,0.0022,abs(uv.y-(y-0.013)));",
"  float dg=step(0.5,fract(u*30.0))*(1.0-smoothstep(0.0,0.0040,abs(uv.y-(y-0.0065))));",
"  c+=vec3(0.15,0.16,0.21)*ch*m;",
"  c+=vec3(0.12,0.13,0.17)*dg*m;",
"  float dash=step(0.42,fract(u*19.0+0.2));",
"  c+=vec3(1.0,0.30,0.55)*(1.0-smoothstep(0.0,0.0010,abs(uv.y-(y+0.0042))))*m*0.42*dash;",
"  return c;",
"}",

/* ---- the hologram : a column of light, a helix of pixels inside it ---- */
"vec3 holoProj(vec2 uv,float t,float id){",
"  vec3 c=vec3(0.0);",
"  float cx=0.435+id*0.345;",
"  float base=uHorizon-0.02, top=uHorizon+0.33-id*0.10;",
"  float h=clamp((uv.y-base)/(top-base),0.0,1.0);",
"  float wid=0.0062;",
"  float dx=abs(uv.x-cx);",
"  float inY=step(base,uv.y)*step(uv.y,top);",
"  float shaft=1.0-smoothstep(wid*0.30,wid,dx);",
"  float flick=0.88+0.12*sin(t*21.0+id*1.7);",
"  float amp=1.0-id*0.50;",
/* a clean shaft of light */
"  c+=vec3(1.0,0.30,0.52)*shaft*inY*(0.20+0.26*h)*flick*amp;",
/* bands of light climbing it */
"  float band=0.5+0.5*sin(h*24.0-t*1.5);",
"  c+=vec3(1.0,0.52,0.72)*shaft*inY*band*0.070*flick*amp;",
/* a hard lit edge, like the rim of a lit slab of glass */
"  float edge=1.0-smoothstep(0.0,0.0022,abs(dx-wid*0.88));",
"  c+=vec3(1.0,0.38,0.60)*edge*inY*0.30*amp;",
/* the pylon that carries it */
"  float tw=1.0-smoothstep(0.0,0.0022,abs(dx-0.019));",
"  float tmask=step(uHorizon-0.085,uv.y)*step(uv.y,uHorizon+0.01);",
"  c+=vec3(0.16,0.18,0.24)*tw*tmask*amp;",
/* the light it throws into the wet air */
"  float sx=(uv.x-cx)/0.13;",
"  c+=vec3(1.0,0.20,0.44)*exp(-sx*sx)*exp(-max(uv.y-top,0.0)*8.0)*0.060*amp;",
"  return c;",
"}",,

/* ==================================================================
   FRAME
   ================================================================== */
"void main(){",
"  vec2 uv=vUv;",
"  float px=uRes.x/uRes.y;",
"  vec3 c;",
/* ---------- SKY ---------- */
"  float above=clamp((uv.y-uHorizon)/0.45,0.0,1.0);",
"  vec3 sky=mix(vec3(0.026,0.052,0.100),vec3(0.002,0.005,0.018),pow(above,0.62));",
"  float az=exp(-pow((uv.x-uSun.x)/0.28,2.0));",
"  sky+=vec3(0.30,0.045,0.115)*exp(-max(uv.y-uHorizon,0.0)*13.0)*az;",
"  sky+=vec3(0.030,0.060,0.130)*exp(-max(uv.y-uHorizon,0.0)*24.0)*0.80;",
"  float veil=fbm3(vec2(uv.x*px*2.4,uTime*0.010+uv.y*2.6));",
"  sky+=vec3(0.040,0.030,0.070)*smoothstep(0.42,0.95,veil)",
"     *smoothstep(uHorizon+0.05,uHorizon+0.42,uv.y);",
"  vec2 sc=uv*vec2(px,1.0)*150.0;",
"  vec2 cell=floor(sc); vec2 cf=fract(sc);",
"  float hh=hash21(cell);",
"  float stp=step(0.9860,hh);",
"  float tw=0.45+0.55*sin(uTime*1.8+hh*40.0);",
"  float dotp=1.0-smoothstep(0.06,0.40,length(cf-0.5));",
"  sky+=vec3(0.72,0.84,1.0)*stp*tw*dotp*0.80",
"     *smoothstep(uHorizon,uHorizon+0.22,uv.y)*(1.0-smoothstep(uHorizon+0.10,uHorizon+0.34,uv.y));",
"  float fogB=exp(-pow((uv.y-uHorizon)/0.040,2.0));",
"  sky+=mix(vec3(0.028,0.050,0.085),vec3(0.160,0.055,0.115),az)*fogB*0.80;",
"  sky+=cloudStrata(uv,uTime);",
"  vec3 skyPure=sky;",
"  sky+=airTraffic(uv,uTime);",
"  sky+=skyBands(uv,uTime);",
"  sky+=sunBody(uv,uTime);",
"  vec4 cc=cityLayer(uv,uTime);",
"  sky=mix(sky,cc.rgb,cc.a);",
"  vec4 pl=powerLines(uv,uTime);",
"  sky*=1.0-0.80*pl.x;",
"  sky+=pl.yzw;",
"  sky+=holoProj(uv,uTime,0.0);",
"  sky+=holoProj(uv,uTime,1.0);",
"  sky+=gantry(uv,uTime);",
"  sky+=sunShafts(uv,uTime)*vec3(1.0,0.40,0.66)*0.13;",
"  sky+=dustMotes(uv,uTime);",
"  sky+=sunBody(uv,uTime);",
"  c=sky;",
/* ---------- THE WAVE FIELD ---------- */
"  float wbase=mix(uShore,uMax,uTide);",
"  float wy=waveY(uv.x,wbase,uWave*0.035,uTime);",
"  float beachM=1.0-smoothstep(wy-0.005,wy+0.005,uv.y);",
"  float hw=mix(uShore,uMax,1.0);",
/* the wedge of low sun on the ground : the world is in shadow away from it */
"  float groundT=max(uHorizon-uv.y,0.0);",
"  float litW=0.008+groundT*0.30;",
"  float lit=exp(-pow((uv.x-uSun.x)/litW,2.0));",
/* ---------- BEACH ---------- */
"  if(beachM>0.002){",
"    float wet=clamp(uWet,0.0,1.0)*smoothstep(hw+0.03,hw-0.12,uv.y);",
"    wet=max(wet,clamp(uWet,0.0,1.0)*(1.0-smoothstep(0.0,0.13,uv.y-wy))*0.75);",
"    vec3 sand=sandLight(sandAt(uv,px,wet),lit,wet);",
"    float bl;",
"    sand=writeInk(sand,uv,vec2(0.0038,0.0030),bl);",
/* the rain hitting the sand : small dark splashes and a damp ring */
/* the wet sand mirrors the city : broken neon lying on the shore */
"    float wr=exp(-max(wy-uv.y,0.0)*18.0)*wet;",
"    float rn=fbm2(vec2(uv.x*24.0,uv.y*70.0-uTime*0.5));",
"    vec3 rc2=mix(vec3(1.0,0.36,0.70),vec3(0.30,0.78,1.0),fract(uv.x*6.0));",
"    sand+=rc2*wr*rn*0.30;",
/* the wave throws a soft shadow forward onto the dry sand */
"    float ahead=1.0-smoothstep(0.0,0.075,wy-uv.y);",
"    sand*=1.0-0.42*ahead*uWave;",
/* --- the tide gives a warning before it lands --- */
/* the shadow the incoming swell throws on the dry sand */
"    float shBand=exp(-pow((wy-uv.y-0.016)/0.026,2.0));",
"    sand*=1.0-0.40*shBand*uWave;",
/* the sand just ahead of the front turns wet and dark */
"    float surge=0.014+0.060*uTide;",
"    float front=clamp((wy-uv.y)/max(surge,0.0001),0.0,1.0);",
"    sand=mix(sand,sand*0.58,front*0.80*uWave);",
"    sand+=vec3(0.48,0.32,0.58)*front*0.05*uWave;",
/* the light on the crest a moment before it breaks */
"    float crestLight=exp(-pow((wy-uv.y-0.0035)/0.0038,2.0));",
"    sand+=vec3(1.0,0.50,0.72)*crestLight*0.34*uWave;",
/* --- the sand the tide has just left : still dark and glossy --- */
"    float damp=clamp((uMark-uv.y)/0.055,0.0,1.0)*step(uv.y,uMark);",
"    sand=mix(sand,sand*0.62,damp*0.85);",
"    sand+=vec3(0.32,0.26,0.52)*damp*0.045;",
/* the wash left by the previous wave */
"    float wash=1.0-smoothstep(0.0,0.055,abs(uv.y-(wy-0.075)));",
"    sand=mix(sand,sand*vec3(0.72,0.80,1.0),wash*0.45*uWave);",

"    c=mix(c,sand,beachM);",
"  }",
/* ---------- THE SEA ---------- */
"  float waterM=smoothstep(wy-0.005,wy+0.005,uv.y)*step(uv.y,uHorizon+0.004);",
"  if(waterM>0.002){",
"    float dep=uv.y-wy;",
"    float dn=clamp(dep*3.6,0.0,1.0);",
"    vec3 w=mix(vec3(0.020,0.034,0.070),vec3(0.004,0.008,0.024),pow(dn,0.5));",
/* the horizon glow, reflected */
"    w+=vec3(0.36,0.09,0.26)*exp(-max(uHorizon-uv.y,0.0)*9.0)*az*0.85;",
/* the bed, seen through the shallow water */
"    vec2 ruv=uv+vec2(sin(uv.x*38.0+uTime*1.9)*0.006*dn,0.006*dn);",
"    vec3 bed=sandLight(sandAt(ruv,px,1.0),lit*0.70,1.0)*1.05;",
"    w=mix(w,bed,0.52*(1.0-dn));",
/* surface caustics and wind streaks */
"    float ca=fbm3(vec2(uv.x*22.0,uv.y*40.0-uTime*1.7));",
"    w+=vec3(0.10,0.22,0.34)*pow(ca,3.0)*0.20*dn*(1.0-dn*0.5);",
"    float streak=fbm2(vec2(uv.x*7.0+uv.y*1.8,uv.y*110.0-uTime*0.35));",
"    w*=1.0+0.16*(streak-0.5)*dn;",
/* the city, broken up and reflected in the water */









/* the city lies in shadow on the far side of the light */
"    float sh=1.0-exp(-pow((uv.x-uSun.x)/0.50,2.0));",
"    w*=1.0-0.26*sh*dn;",
/* the glitter path of the sun, broken by the same swell */
"    float gp=sunPath(uv,uTime,dep);",
"    w+=vec3(1.0,0.26,0.50)*gp*1.45;",
"    w+=vec3(0.30,0.80,1.0)*gp*gp*0.38;",
"    float sw=0.028+0.55*max(uHorizon-uv.y,0.0);",
"    w+=vec3(1.0,0.20,0.40)*exp(-pow((uv.x-uSun.x)/sw,2.0))*0.085*(0.55+0.75*swellPulse(uv,uTime,dep));",
/* the receding swell : the sea is a stack of thin broken lines,
   and the nearer the shore the bigger the swell */
"    float crests=0.0;",
"    float crestNear=0.0;",
"    for(int k=1;k<5;k++){",
"      float fk=float(k);",
"      float off=0.058-0.0148*(fk-1.0);",
"      float amp=(1.25-fk*0.16)*uWave*0.030+0.0022;",
"      float frq=1.0+fk*0.55;",
"      float rt=0.80+fk*0.22;",
"      float yk=wy+off+waveShape(uv.x*frq+fk*3.1,rt*uTime)*amp;",
"      float bw2=0.0022-fk*0.00040;",
"      float b=1.0-smoothstep(0.0,max(bw2,0.0006),abs(uv.y-yk));",
/* the crest is not a solid line : it breaks into separate glints */
"      float brk=smoothstep(0.36,0.74,fbm3(vec2(uv.x*30.0+fk*7.0,uv.y*70.0-uTime*0.9)));",
"      float w=(1.0-fk*0.14);",
"      crests=max(crests,b*brk*w);",
/* the swell closest to the shore throws a crest of its own */
"      if(k==1) crestNear=max(crestNear,b*brk*brk);",
"    }",
"    float ccol=floor(uv.x*22.0);",
"    float ch=hash11(ccol*2.7+9.0);",
"    float ch2=hash11(ccol*5.3+1.0);",
"    vec3 cityC=mix(vec3(1.0,0.36,0.60),vec3(0.30,0.80,1.0),step(0.55,ch));",
"    w+=mix(vec3(0.28,0.52,0.95),cityC,0.30+0.70*ch2)*crests*0.30*(1.0-dn*0.35);",
"    w+=mix(vec3(0.60,0.80,1.0),vec3(1.0,0.40,0.72),az)*crestNear*0.16;",
/* capillary ripples : a very fine, barely there texture */
"    float fine=0.0;",
"    for(int k=0;k<2;k++){",
"      float fk=float(k);",
"      float yk2=wy+0.007+fk*0.015+sin(uv.x*46.0+uTime*1.3+fk)*0.0016",
"                 +waveShape(uv.x*9.0+fk*5.0,uTime*0.9)*0.0035;",
"      float b2=1.0-smoothstep(0.0,0.0010,abs(uv.y-yk2));",
"      fine=max(fine,b2*(0.45+0.55*fbm2(vec2(uv.x*64.0,uv.y*24.0-uTime*0.7))));",
"    }",
"    w+=mix(vec3(0.24,0.40,0.72),vec3(1.0,0.30,0.58),az)*fine*0.075*(1.0-dn*0.6);",
/* the sky lies on the water as thin broken sheets */
"    float sheets=0.0;",
"    for(int k=0;k<2;k++){",
"      float fk=float(k);",
"      float yk3=wy+0.018+fk*0.026+waveShape(uv.x*5.2+fk*7.0,uTime*0.7)*0.0055;",
"      sheets+=1.0-smoothstep(0.0,0.0016,abs(uv.y-yk3));",
"    }",
"    w+=mix(vec3(0.16,0.28,0.52),vec3(1.0,0.32,0.60),az)*sheets*0.055*(1.0-dn*0.5);",
/* the rain landing on the water : rings that open, and a small flash */
/* thin filaments drifting over the water : the contour of the swell */
"    float fil=0.0;",
"    for(int i=0;i<3;i++){",
"      float fi=float(i);",
"      float ly2=wy+0.010+fi*0.052+sin(uTime*0.09+fi*2.0)*0.004;",
"      float wob=waveShape(uv.x*2.4+fi*3.0,uTime*0.4)*0.0055;",
"      if(abs(uv.y-ly2-wob)<0.004) fil+=exp(-pow((uv.y-ly2-wob)/0.00045,2.0))*(1.0-fi*0.22);",
"    }",
"    w+=mix(vec3(0.55,0.75,1.0),vec3(1.0,0.35,0.72),az)*fil*0.075;",
/* the breaking edge at the shore */
"    float fn=fbm3(vec2(uv.x*88.0,dep*210.0-uTime*2.4));",
"    float foam=(1.0-smoothstep(0.0,0.042,dep))*(0.22+0.86*fn);",
"    float crest=smoothstep(-0.15,0.55,waveShape(uv.x,uTime*0.8));",
"    foam*=(0.40+0.80*crest);",
"    vec3 foamC=mix(vec3(0.42,0.56,0.82),vec3(1.0,0.30,0.58),min(1.0,lit*0.6+az*0.4));",
"    w=mix(w,foamC,clamp(foam,0.0,1.0)*0.40);",
"    w+=vec3(1.0,0.50,0.84)*(1.0-smoothstep(0.0,0.005,abs(dep)))*0.36;",
"    w+=vec3(1.0,0.36,0.72)*(1.0-smoothstep(0.0,0.005,abs(dep)))*0.20;",
/* the far water dissolves into the sky : aerial perspective */
"    float hz=smoothstep(uHorizon-0.034,uHorizon-0.001,uv.y);",
"    w=mix(w,skyPure*0.62+vec3(0.004,0.005,0.009),hz*0.62);",
"    c=mix(c,w,waterM);",
"  }",
/* mouse halo */
"  if(uMouseOn>0.5){",
"    float r=length((uv-uMouse)*vec2(px,1.0));",
"    c+=vec3(1.0,0.38,0.74)*exp(-r*10.0)*0.12;",
"  }",
"  c+=vec3(1.0,0.34,0.70)*uFlash*0.15;",
"  gl_FragColor=vec4(c,1.0);",
"}"
].join("\n");

/* ---------- EROSION (ping-pong) : the tide takes the writing back ---------- */
var ERO_SRC = LIB + [
"varying vec2 vUv;",
"uniform sampler2D uEro;",
"uniform float uTime,uTide,uWave,uShore,uMax,uDt;",
"uniform vec4 uBox;",
"void main(){",
"  float prev=texture2D(uEro,vUv).r;",
"  vec2 st=uBox.xy+vUv*uBox.zw;",
"  float wy=waveY(st.x,mix(uShore,uMax,uTide),uWave*0.035,uTime);",
"  float dep=st.y-wy;",
"  float n=hash21(floor(vUv*256.0)*1.7);",
"  float add=0.0;",
"  if(dep>-0.020){ add=uDt*(dep>0.0?clamp(dep*42.0,0.5,2.6):0.14)*(1.1+1.5*n); }",
"  float p=clamp(prev+add,0.0,1.0);",
"  gl_FragColor=vec4(p,p,p,1.0);",
"}"
].join("\n");

/* ---------- BLOOM : bright pass + separable blur ---------- */
var BRIGHT_SRC = LIB + [
"varying vec2 vUv;",
"uniform sampler2D uTex;",
"uniform float uThresh;",
"void main(){",
"  vec3 c=texture2D(uTex,vUv).rgb;",
"  float l=max(max(c.r,c.g),c.b);",
"  float k=max(l-uThresh,0.0)/max(l,1e-4);",
"  gl_FragColor=vec4(c*k,1.0);",
"}"
].join("\n");

var BLUR_SRC = LIB + [
"varying vec2 vUv;",
"uniform sampler2D uTex;",
"uniform vec2 uDir;",
"void main(){",
"  vec3 s=texture2D(uTex,vUv).rgb*0.227027;",
"  s+=texture2D(uTex,vUv+uDir*1.3846).rgb*0.316216;",
"  s+=texture2D(uTex,vUv-uDir*1.3846).rgb*0.316216;",
"  s+=texture2D(uTex,vUv+uDir*3.2308).rgb*0.070270;",
"  s+=texture2D(uTex,vUv-uDir*3.2308).rgb*0.070270;",
"  gl_FragColor=vec4(s,1.0);",
"}"
].join("\n");

/* ---------- POST : tonemap, bloom, vignette, grain ---------- */
var POST_SRC = LIB + [
"varying vec2 vUv;",
"uniform sampler2D uTex,uBloom;",
"uniform vec2 uRes;",
"uniform float uTime,uBloomK;",
"vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.0,1.0); }",
/* slanted rain : two parallax layers of streaks, over the whole frame */
/* rain : sparse, uneven, each drop a different length and speed */
,
"void main(){",
"  vec2 uv=vUv; vec2 d=uv-0.5;",
/* depth of field : the far field softens, the sand stays sharp */
"  float dofR=smoothstep(0.28,0.96,uv.y)*2.6+(1.0-smoothstep(0.0,0.18,uv.y))*2.2;",
"  vec2 px=dofR/uRes;",
"  vec3 c=texture2D(uTex,uv).rgb*0.38;",
"  c+=texture2D(uTex,uv+vec2(px.x*1.7,0.0)).rgb*0.155;",
"  c+=texture2D(uTex,uv-vec2(px.x*1.7,0.0)).rgb*0.155;",
"  c+=texture2D(uTex,uv+vec2(0.0,px.y*0.75)).rgb*0.155;",
"  c+=texture2D(uTex,uv-vec2(0.0,px.y*0.75)).rgb*0.155;",
"  c+=texture2D(uBloom,uv).rgb*uBloomK;",
"  c=aces(c*1.06);",
"  c*=1.0-0.40*pow(length(d*vec2(1.0,1.08)),2.4);",
"  float g=hash21(uv*uRes+fract(uTime*0.7)*137.0);",
"  c+=(g-0.5)*0.008;",
"  c+=(hash21(uv*uRes*1.7)-0.5)/255.0;",
"  gl_FragColor=vec4(max(c,vec3(0.0)),1.0);",
"}"
].join("\n");

/* ==================================================================
   2. WEBGL RUNTIME
   ================================================================== */
var glc=document.getElementById('gl');

  preserveDrawingBuffer:true,powerPreference:'high-performance'});

function compile(type,src){
  var s=gl.createShader(type);
  gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)+"\n"+src);
  return s;
}
function program(vs,fs){
  var p=gl.createProgram();
  gl.attachShader(p,compile(gl.VERTEX_SHADER,vs));
  gl.attachShader(p,compile(gl.FRAGMENT_SHADER,fs));
  gl.bindAttribLocation(p,0,'aPos');
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}
function uniforms(p,names){
  var o={}; for(var i=0;i<names.length;i++) o[names[i]]=gl.getUniformLocation(p,names[i]);
  return o;
}

var progScene,progEro,progPost,progBright,progBlur,U={},UE={},UP={},UB={},UBLUR={};
var quad=null;
function makeQuad(){
  quad=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,quad);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
}
function drawQuad(){ gl.drawArrays(gl.TRIANGLES,0,3); }

function newTex(w,h,filter){
  var t=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,filter||gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,filter||gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  return t;
}
function newFBO(tex){
  var f=gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER,f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  return f;
}
function bindTex(unit,tex,loc){
  gl.activeTexture(gl.TEXTURE0+unit);
  gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.uniform1i(loc,unit);
}

var ERO_SIZE=384;
var texInk,texScene,texBloomA,texBloomB,sceneFbo,bloomFboA,bloomFboB,BLOOMW=2,BLOOMH=2;
var eroTex=[],eroFbo=[],eroCur=0;
var inkCv=document.getElementById('ink'),inkCx=inkCv.getContext('2d');
var IBOX={x:0,y:0,w:0,h:0},SS=1;

function initGL(){
  progScene=program(VS_SRC,SCENE_SRC);
  progEro=program(VS_SRC,ERO_SRC);
  progPost=program(VS_SRC,POST_SRC);
  progBright=program(VS_SRC,BRIGHT_SRC);
  progBlur=program(VS_SRC,BLUR_SRC);
  U=uniforms(progScene,['uRes','uTime','uTide','uWave','uCharge','uFlash','uWet','uHint',
    'uShore','uMax','uHorizon','uSun','uBox','uInk','uEro','uMouse','uMouseOn','uMark']);
  UE=uniforms(progEro,['uEro','uTime','uTide','uWave','uShore','uMax','uDt','uBox']);
  UP=uniforms(progPost,['uTex','uBloom','uRes','uTime','uBloomK']);
  UB=uniforms(progBright,['uTex','uThresh']);
  UBLUR=uniforms(progBlur,['uTex','uDir']);
  makeQuad();

  texInk=newTex(2,2);
  for(var i=0;i<2;i++){ eroTex[i]=newTex(ERO_SIZE,ERO_SIZE); eroFbo[i]=newFBO(eroTex[i]); }

/* ==================================================================
   3. LAYOUT
   ================================================================== */
var W=0,H=0,DPR=1;
var HORIZON=0.665, SHORE=0.462, MAXY=0.028;   // GL space, y up
var SUN=[0.665,0.706];

function layout(){
  var rc=document.getElementById('stage').getBoundingClientRect();
  W=Math.max(320,Math.round(rc.width));
  H=Math.max(320,Math.round(rc.height));
  DPR=Math.min(window.devicePixelRatio||1,2);
  /* keep the fragment cost sane on large displays : the scene is soft,
     rendering four times the pixels buys nothing but a dropped context */
  var maxPix=1500000;
  if(W*H*DPR*DPR>maxPix) DPR=Math.max(1,Math.sqrt(maxPix/(W*H)));
  glc.width=Math.round(W*DPR); glc.height=Math.round(H*DPR);
  gl.viewport(0,0,glc.width,glc.height);

  /* the whole beach is writable */
  IBOX.x=0; IBOX.w=W; IBOX.y=(1-SHORE)*H; IBOX.h=SHORE*H;

  SS=Math.min(1.5,Math.max(1,Math.round((IBOX.w/700)*2)/2));
  inkCv.width=Math.round(IBOX.w*SS); inkCv.height=Math.round(IBOX.h*SS);

  texScene=newTex(glc.width,glc.height);
  if(!sceneFbo) sceneFbo=gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER,sceneFbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,texScene,0);

  var bw=Math.max(2,Math.round(glc.width/4)), bh=Math.max(2,Math.round(glc.height/4));
  BLOOMW=bw; BLOOMH=bh;
  texBloomA=newTex(bw,bh);
  texBloomB=newTex(bw,bh);
  bloomFboA=newFBO(texBloomA);
  bloomFboB=newFBO(texBloomB);

  gl.bindFramebuffer(gl.FRAMEBUFFER,null);

  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
  gl.bindTexture(gl.TEXTURE_2D,texInk); uploadCanvas(texInk,inkCv);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
  inkDirty=false;
}
function uploadCanvas(tex,cv){
  gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,cv);
}
function clearEro(){
  for(var i=0;i<2;i++){
    gl.bindFramebuffer(gl.FRAMEBUFFER,eroFbo[i]);
    gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT);
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  eroCur=0;
}

/* ==================================================================
   4. WRITING IN THE SAND
   ================================================================== */
var strokes=[],cur=null,drawing=false,inkDirty=false;
var charge=0,flash=0,mouse=[-9,-9],mouseOn=0;
var idleT=0,hintV=1;

function inkPos(ev){
  var rc=glc.getBoundingClientRect();
  var x=(ev.clientX-rc.left)/rc.width*W;
  var y=(ev.clientY-rc.top)/rc.height*H;
  return [ (x-IBOX.x)/IBOX.w, (y-IBOX.y)/IBOX.h ];
}
function inside(p){ return p[0]>=0&&p[0]<=1&&p[1]>=0&&p[1]<=1; }

function inkBegin(ev){
  if(STATE!=='IDLE') return;
  var p=inkPos(ev);
  if(!inside(p)) return;
  drawing=true; cur=[p]; strokes.push(cur); idleT=0; inkDirty=true; hintV=0;
  if(glc.setPointerCapture&&ev.pointerId!=null) glc.setPointerCapture(ev.pointerId);
  ev.preventDefault();
}
function inkMove(ev){
  var p=inkPos(ev);
  mouseOn=1; mouse=[(IBOX.x+p[0]*IBOX.w)/W,1-(IBOX.y+p[1]*IBOX.h)/H];
  if(!drawing) return;
  var last=cur[cur.length-1];
  if(Math.abs(last[0]-p[0])*W<2&&Math.abs(last[1]-p[1])*H<2) return;
  cur.push(p);
  inkStamp(last,p); inkDirty=true;
}
function inkEnd(){
  if(!drawing) return;
  drawing=false; cur=null; inkDirty=true; idleT=0;
}
function inkStamp(a,b){
  var g=inkCx,w=inkCv.width,h=inkCv.height;
  var ax=a[0]*w,ay=a[1]*h,bx=b[0]*w,by=b[1]*h;
  var wgt=Math.max(6,Math.round(IBOX.h*0.028));
  g.lineCap='round'; g.lineJoin='round';
  /* three passes : the sand is displaced, not cut */
  g.lineWidth=wgt*SS*1.60; g.strokeStyle='rgba(255,255,255,0.22)';
  g.beginPath(); g.moveTo(ax,ay); g.lineTo(bx,by); g.stroke();
  g.lineWidth=wgt*SS*1.05; g.strokeStyle='rgba(255,255,255,0.48)';
  g.beginPath(); g.moveTo(ax,ay); g.lineTo(bx,by); g.stroke();
  g.lineWidth=wgt*SS*0.42; g.strokeStyle='rgba(255,255,255,0.95)';
  g.beginPath(); g.moveTo(ax,ay); g.lineTo(bx,by); g.stroke();
}
function inkAmount(){
  var s=0;
  for(var i=0;i<strokes.length;i++){
    var st=strokes[i];
    for(var k=1;k<st.length;k++) s+=Math.hypot(st[k][0]-st[k-1][0],st[k][1]-st[k-1][1]);
  }
  return s;
}
function clearInk(){
  strokes=[]; cur=null; drawing=false;
  inkCx.clearRect(0,0,inkCv.width,inkCv.height);
  inkDirty=true; clearEro(); charge=0;
  STATE='IDLE';
}

/* ==================================================================
   5. GLYPH RECOGNITION  (the tide only answers to two characters)
   ================================================================== */
var GLYPH_FONT='"Microsoft YaHei","PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif';
var TARGETS=['祁','煜'];
var RG=18, TPL=null;
/* look-alike negative samples: tighten the decision, never a target */
var DECOYS=['\u7948','\u7950','\u7953','\u7957','\u70e7','\u711f','\u709c','\u708a','\u70ed','\u711c'];

function inkMaskFromGlyphs(chars,scale,rot,wobble){
  var S=200,c=document.createElement('canvas');c.width=S;c.height=S;
  var g=c.getContext('2d');
  g.fillStyle='#000';g.fillRect(0,0,S,S);
  g.save();
  g.translate(S/2,S/2);g.rotate(rot);g.scale(scale,scale);g.translate(-S/2,-S/2);
  g.font='900 '+Math.round(S*0.40)+'px '+GLYPH_FONT;
  g.textAlign='center';g.textBaseline='middle';g.fillStyle='#fff';
  for(var i=0;i<chars.length;i++) g.fillText(chars[i],S*(0.255+i*0.49),S*0.5);
  g.restore();
  var im=g.getImageData(0,0,S,S).data;
  var m=new Float32Array(S*S);
  for(i=0;i<S*S;i++) m[i]=im[i*4]/255;
  for(var b=0;b<wobble;b++){
    var cx=(Math.random()*0.6+0.2)*S,cy=(Math.random()*0.6+0.2)*S,r=6+Math.random()*14;
    for(var y=Math.max(0,cy-r|0);y<Math.min(S,cy+r);y++)
      for(var x=Math.max(0,cx-r|0);x<Math.min(S,cx+r);x++){
        var d=Math.hypot(x-cx,y-cy); if(d<r)m[y*S+x]=Math.max(m[y*S+x],1-d/r); }
  }
  return {m:m,w:S,h:S};
}

function maskToGrid(mask,w,h,bx0,by0,bw,bh){
  var g=new Float32Array(RG*RG);
  var kx=RG/bw, ky=RG/bh;
  for(var y=0;y<RG;y++){
    var ya=by0+y/ky, yb=by0+(y+1)/ky;
    for(var x=0;x<RG;x++){
      var xa=bx0+x/kx, xb=bx0+(x+1)/kx;
      var s=0,c=0,xx,yy,ix,iy;
      for(yy=ya|0; yy<=yb; yy++){ iy=yy; if(iy<0||iy>=h) continue;
        for(xx=xa|0; xx<=xb; xx++){ ix=xx; if(ix<0||ix>=w) continue; s+=mask[iy*w+ix]; c++; } }
      g[y*RG+x]=c>0?s/c:0;
    }
  }
  return blurGrid(g,RG,1);
}
function blurGrid(a,G,r){
  var t=new Float32Array(G*G),i,x,y;
  for(y=0;y<G;y++)for(x=0;x<G;x++){
    var s=0,c=0;
    for(var k=-r;k<=r;k++){var xx=x+k;if(xx<0||xx>=G)continue;s+=a[y*G+xx];c++;}
    t[y*G+x]=s/c;
  }
  var o=new Float32Array(G*G);
  for(y=0;y<G;y++)for(x=0;x<G;x++){
    var s2=0,c2=0;
    for(k=-r;k<=r;k++){var yy=y+k;if(yy<0||yy>=G)continue;s2+=t[yy*G+x];c2++;}
    o[y*G+x]=s2/c2;
  }
  return o;
}
function buildTPL(){
  TPL={};
  var all=TARGETS.concat(DECOYS);
  for(var i=0;i<all.length;i++){
    var ch=all[i],S=140,c=document.createElement('canvas');c.width=S;c.height=S;
    var g=c.getContext('2d');
    g.fillStyle='#000';g.fillRect(0,0,S,S);
    g.font='900 '+Math.round(S*0.88)+'px '+GLYPH_FONT;
    g.textAlign='center';g.textBaseline='middle';g.fillStyle='#fff';
    g.fillText(ch,S/2,S/2);
    var im=g.getImageData(0,0,S,S).data,m=new Float32Array(S*S);
    for(var k=0;k<S*S;k++) m[k]=im[k*4]/255;
    var bb=bboxOf(m,S,S,0.30);
    TPL[ch]=maskToGrid(m,S,S,bb.x,bb.y,bb.w,bb.h);
  }
}
function bboxOf(m,w,h,thr){
  var x0=w,y0=h,x1=-1,y1=-1;
  for(var y=0;y<h;y++)for(var x=0;x<w;x++)
    if(m[y*w+x]>thr){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
  if(x1<0) return {x:0,y:0,w:w,h:h};
  var pad=Math.round(Math.max(2,(x1-x0)*0.06));
  x0=Math.max(0,x0-pad);x1=Math.min(w-1,x1+pad);
  y0=Math.max(0,y0-pad);y1=Math.min(h-1,y1+pad);
  return {x:x0,y:y0,w:x1-x0+1,h:y1-y0+1};
}
function simBest(a,b){
  var best=0,G=RG,dx,dy,x,y;
  for(dy=-3;dy<=3;dy++)for(dx=-3;dx<=3;dx++){
    var num=0,den=0;
    for(y=0;y<G;y++){
      var by=y+dy; if(by<0||by>=G) continue;
      for(x=0;x<G;x++){
        var bx=x+dx; if(bx<0||bx>=G) continue;
        var v=b[by*G+bx],u=a[y*G+x];
        num+=Math.abs(u-v); den+=(u>v?u:v);
      }
    }
    if(den>0){ var s=1-num/den; if(s>best)best=s; }
  }
  return best;
}
/* split a two-glyph mask at the emptiest column near the middle */
function splitHalves(m,w,h){
  var bb=bboxOf(m,w,h,0.22);
  var cols=new Float32Array(bb.w);
  for(var x=0;x<bb.w;x++){
    var s=0; for(var y=0;y<bb.h;y++) s+=m[(bb.y+y)*w+bb.x+x];
    cols[x]=s;
  }
  var peak=0; for(x=0;x<bb.w;x++) if(cols[x]>peak) peak=cols[x];
  if(peak<=0) return null;
  var lo=(bb.w*0.28)|0, hi=(bb.w*0.72)|0, split=lo, bv=1e9;
  for(x=lo;x<hi;x++) if(cols[x]<bv){bv=cols[x];split=x;}
  if(bv>peak*0.16) return null;
  var B=bb.x+split;
  var cwA=Math.max(2,split-2), cwB=Math.max(2,bb.w-split-2);
  var la=bboxOf(sub(m,w,h,bb.x,bb.y,cwA,bb.h),cwA,bb.h,0.22);
  var lb=bboxOf(sub(m,w,h,B,bb.y,cwB,bb.h),cwB,bb.h,0.22);
  if(!la||!lb||la.w<3||lb.w<3) return null;
  return {a:maskToGrid(m,w,h,bb.x+la.x,bb.y+la.y,la.w,la.h),
          b:maskToGrid(m,w,h,B+lb.x,bb.y+lb.y,lb.w,lb.h)};
}
function sub(m,w,h,x0,y0,cw,ch){
  var o=new Float32Array(cw*ch);
  for(var y=0;y<ch;y++)for(var x=0;x<cw;x++){
    var sx=x0+x,sy=y0+y;
    if(sx<0||sx>=w||sy<0||sy>=h) continue;
    o[y*cw+x]=m[sy*w+sx];
  }
  return o;
}
function matchGlyph(grid){
  var out={};
  for(var i=0;i<TARGETS.length+DECOYS.length;i++){
    var ch=TARGETS.concat(DECOYS)[i];
    out[ch]=simBest(grid,TPL[ch]);
  }
  return out;
}
var TH=0.50, MARGIN=0.0;
function bestFor(sc,target){
  var mine=sc[target],other=0,near='';
  for(var k in sc) if(k!==target&&sc[k]>other){other=sc[k];near=k;}
  return {s:mine,margin:mine-other,near:near};
}
function recognizeMask(m,w,h){
  var halves=splitHalves(m,w,h);
  if(!halves) return {ok:false,s:0,why:'TWO GLYPHS NEEDED'};
  var A=matchGlyph(halves.a),B=matchGlyph(halves.b);
  var t0=TARGETS[0],t1=TARGETS[1];
  var f0=bestFor(A,t0),g1=bestFor(B,t1);
  var f1=bestFor(A,t1),g0=bestFor(B,t0);
  var ord0=f0.s+g0.s, ord1=f1.s+g1.s;
  var u0=ord0>=ord1;
  var L=u0?f0:f1, R=u0?g1:g0;
  var sc2=Math.min(L.s,R.s), marg=Math.min(L.margin,R.margin);
  var ok=(sc2>=TH);
  return {ok:ok,s:sc2,margin:marg,left:L.s,right:R.s,swapped:!u0,
          why:ok?'':(sc2<TH?'NO MATCH':'AMBIGUOUS - RESHAPE')};
}
function strokesMask(){
  var W2=256,H2=Math.max(64,Math.round(256*inkCv.height/inkCv.width));
  if(!strokeCv){ strokeCv=document.createElement('canvas'); }
  if(strokeCv.width!==W2||strokeCv.height!==H2){ strokeCv.width=W2; strokeCv.height=H2; }
  var g=strokeCv.getContext('2d');
  g.fillStyle='#000';g.fillRect(0,0,W2,H2);
  g.lineCap='round';g.lineJoin='round';
  g.strokeStyle='#fff';g.lineWidth=Math.max(3,W2*0.030);
  for(var i=0;i<strokes.length;i++){
    var s=strokes[i]; if(s.length<1) continue;
    g.beginPath();g.moveTo(s[0][0]*W2,s[0][1]*H2);
    for(var k=1;k<s.length;k++) g.lineTo(s[k][0]*W2,s[k][1]*H2);
    g.stroke();
  }
  var im=g.getImageData(0,0,W2,H2).data,m=new Float32Array(W2*H2);
  for(i=0;i<W2*H2;i++) m[i]=im[i*4]/255;
  return {m:m,w:W2,h:H2};
}
var strokeCv=null,lastRecog=0,recog={ok:false,s:0};
function runRecognition(force){
  var now=performance.now();
  if(!force&&now-lastRecog<110) return;
  lastRecog=now;
  var total=0; for(var i=0;i<strokes.length;i++) total+=strokes[i].length;
  if(strokes.length<1||total<6){ recog={ok:false,s:0}; return; }
  var mk=strokesMask();
  recog=recognizeMask(mk.m,mk.w,mk.h);
}function strokesFromMask(m,w,h,thr){
  var out=[];
  for(var y=0;y<h;y++){
    var x=0;
    while(x<w){
      if(m[y*w+x]>thr){
        var x0=x;
        while(x<w&&m[y*w+x]>thr) x++;
        out.push([[(x0+0.5)/w,(y+0.5)/h],[(x+0.5)/w,(y+0.5)/h]]);
      } else x++;
    }
  }
  return out;
}
/* the two characters, rendered as stroke polylines : used by the ?auto test */
function glyphStrokes(){
  var W=512,H=Math.max(64,Math.round(512*inkCv.height/inkCv.width));
  var c=document.createElement('canvas'); c.width=W; c.height=H;
  var g=c.getContext('2d');
  g.fillStyle='#000'; g.fillRect(0,0,W,H);
  g.font='900 '+Math.round(H*0.60)+'px '+GLYPH_FONT;
  g.textAlign='center'; g.textBaseline='middle'; g.fillStyle='#fff';
  g.fillText(TARGETS[0],W*0.30,H*0.5);
  g.fillText(TARGETS[1],W*0.70,H*0.5);
  var im=g.getImageData(0,0,W,H).data, m=new Float32Array(W*H);
  for(var i=0;i<W*H;i++) m[i]=im[i*4]/255;
  /* write them into the sand for real */
  var g2=inkCx;
  g2.clearRect(0,0,inkCv.width,inkCv.height);
  g2.drawImage(c,0,0,inkCv.width,inkCv.height);
  return strokesFromMask(m,W,H,0.25);
}

/* ==================================================================
/* ==================================================================
   5. TIDE
   ================================================================== */
var STATE='IDLE';
var T=0,TIDE_DUR=6.2,TIDE_HOLD=2.2;
var PH={s0:0.03,s1:0.58,h1:0.70,r1:0.92};
function easeIO(t){ return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2; }
function tideP(tt){
  var p=0;
  if(tt>=PH.s0){
    if(tt<PH.s1) p=easeIO((tt-PH.s0)/(PH.s1-PH.s0));
    else if(tt<PH.h1) p=1;
    else if(tt<PH.r1) p=1-easeIO((tt-PH.h1)/(PH.r1-PH.h1));
  }
  if(tt>=PH.s0&&tt<=PH.r1) p+=0.012*Math.sin(tt*Math.PI*11);
  return Math.max(-0.02,Math.min(1.05,p));
}
function startTide(){
  if(STATE!=='IDLE') return;
  STATE='TIDE'; T=0; flash=1; charge=1; clearEro();
}
function finishTide(){
  STATE='HOLD'; T=1; holdT=TIDE_HOLD;
}
var holdT=0;

/* ==================================================================
   6. FRAME
   ================================================================== */
var prevT=performance.now(),tsec=0,wetV=0,wetMark=0,DBG=false,HOLD=false;

function uniformsNow(){
  return (STATE==='TIDE'||STATE==='HOLD')?tideP(T):0;
}
function waveAmp(){
  if(STATE==='TIDE') return Math.min(1,tideP(T)*1.3+0.2);
  if(STATE==='HOLD') return 0.45;
  return 0.10;
}
function setSceneU(){
  gl.useProgram(progScene);
  gl.uniform2f(U.uRes,glc.width,glc.height);
  gl.uniform1f(U.uTime,tsec);
  gl.uniform1f(U.uTide,uniformsNow());
  gl.uniform1f(U.uWave,waveAmp());
  gl.uniform1f(U.uCharge,charge);
  gl.uniform1f(U.uFlash,flash);
  gl.uniform1f(U.uWet,wetV);
  gl.uniform1f(U.uHint,hintV);
  gl.uniform1f(U.uMark,wetMark);
  gl.uniform1f(U.uShore,SHORE);
  gl.uniform1f(U.uMax,MAXY);
  gl.uniform1f(U.uHorizon,HORIZON);
  gl.uniform2f(U.uSun,SUN[0],SUN[1]);
  gl.uniform4f(U.uBox,IBOX.x/W,1-(IBOX.y+IBOX.h)/H,IBOX.w/W,IBOX.h/H);
  gl.uniform2f(U.uMouse,mouse[0],mouse[1]);
  gl.uniform1f(U.uMouseOn,mouseOn);
}
function eroStep(dt){
  var dst=1-eroCur;
  gl.bindFramebuffer(gl.FRAMEBUFFER,eroFbo[dst]);
  gl.viewport(0,0,ERO_SIZE,ERO_SIZE);
  gl.useProgram(progEro);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D,eroTex[eroCur]);
  gl.uniform1i(UE.uEro,0);
  gl.uniform1f(UE.uTime,tsec);
  gl.uniform1f(UE.uTide,uniformsNow());
  gl.uniform1f(UE.uWave,waveAmp());
  gl.uniform1f(UE.uShore,SHORE);
  gl.uniform1f(UE.uMax,MAXY);
  gl.uniform1f(UE.uDt,dt);
  gl.uniform4f(UE.uBox,IBOX.x/W,1-(IBOX.y+IBOX.h)/H,IBOX.w/W,IBOX.h/H);
  drawQuad();
  eroCur=dst;
}
function render(dt){
  if(STATE==='TIDE') eroStep(Math.min(dt,0.05));

  /* ---- scene ---- */
  gl.bindFramebuffer(gl.FRAMEBUFFER,sceneFbo);
  gl.viewport(0,0,glc.width,glc.height);
  setSceneU();
  bindTex(0,texInk,U.uInk);
  bindTex(1,eroTex[eroCur],U.uEro);
  drawQuad();

  /* ---- bloom : bright pass, blur h, blur v ---- */
  var bw=BLOOMW,bh=BLOOMH;
  gl.bindFramebuffer(gl.FRAMEBUFFER,bloomFboA);
  gl.viewport(0,0,bw,bh);
  gl.useProgram(progBright);
  bindTex(0,texScene,UB.uTex);
  gl.uniform1f(UB.uThresh,0.48);
  drawQuad();

  gl.bindFramebuffer(gl.FRAMEBUFFER,bloomFboB);
  gl.useProgram(progBlur);
  bindTex(0,texBloomA,UBLUR.uTex);
  gl.uniform2f(UBLUR.uDir,1.4/bw,0);
  drawQuad();

  gl.bindFramebuffer(gl.FRAMEBUFFER,bloomFboA);
  bindTex(0,texBloomB,UBLUR.uTex);
  gl.uniform2f(UBLUR.uDir,0,1.4/bh);
  drawQuad();

  /* ---- post ---- */
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.viewport(0,0,glc.width,glc.height);
  gl.useProgram(progPost);
  bindTex(0,texScene,UP.uTex);
  bindTex(1,texBloomA,UP.uBloom);
  gl.uniform2f(UP.uRes,glc.width,glc.height);
  gl.uniform1f(UP.uTime,tsec);
  gl.uniform1f(UP.uBloomK,0.62);
  drawQuad();
}

function frame(now){
  var dt=(now-prevT)/1000; prevT=now;
  if(dt>0.1)dt=0.1; if(dt<0)dt=0;
  tsec+=dt;

  if(drawing){ idleT=0; charge=lerp(charge,1,dt*7); }
  else{ idleT+=dt; charge=lerp(charge,0.10,dt*2.4); }
  if(hintV>0&&(drawing||tsec>10)) hintV=Math.max(0,hintV-dt*2.0);

  if(STATE==='IDLE'&&!drawing) runRecognition(false);
  if(!HOLD&&STATE==='IDLE'&&!drawing&&recog.ok&&idleT>0.8) startTide();
  if(STATE==='TIDE'){ T+=dt/TIDE_DUR; if(T>=1) finishTide(); }
  if(STATE==='HOLD'){ holdT-=dt; if(holdT<=0) clearInk(); }

  var wt=(STATE==='TIDE'||STATE==='HOLD')
    ? (T<PH.r1?1:Math.max(0,Math.min(1,1-(T-PH.r1)/(1-PH.r1)))) : 0;
  wetV=lerp(wetV,wt,1-Math.pow(0.02,dt));

  /* the tide leaves a mark on the sand, and the sand slowly dries */
  var wyNow=lerp(SHORE,MAXY,uniformsNow());
  if(STATE==='TIDE'||STATE==='HOLD'){ if(wyNow>wetMark) wetMark=wyNow; }
  else wetMark=Math.max(0,wetMark-0.010*dt);

  flash=Math.max(0,flash-dt*1.6);

  if(inkDirty){
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
    uploadCanvas(texInk,inkCv);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
    inkDirty=false;
  }

  render(dt);
  if(!DBG) requestAnimationFrame(frame);
}
function lerp(a,b,t){ return a+(b-a)*t; }

/* ==================================================================
   7. INPUT
   ================================================================== */
glc.addEventListener('pointerdown',inkBegin);
window.addEventListener('pointermove',inkMove);
window.addEventListener('pointerup',inkEnd);
window.addEventListener('pointercancel',inkEnd);
glc.addEventListener('pointerleave',function(){mouseOn=0;mouse=[-9,-9];});
glc.addEventListener('contextmenu',function(e){e.preventDefault();});
window.addEventListener('keydown',function(e){
  if(e.code==='Space'){ e.preventDefault(); if(STATE==='IDLE') startTide(); }
  else if(e.code==='KeyC'){ clearInk(); }
});

/* ==================================================================
   8. BOOT
   ================================================================== */
var rzT=null;
window.addEventListener('resize',function(){ clearTimeout(rzT); rzT=setTimeout(function(){ layout(); },160); });

function boot(){
  initGL();
  layout();
  buildTPL();
  var qq=new URLSearchParams(location.search);
  HOLD=qq.has('notide');

  var b=document.getElementById('boot');
  var q=new URLSearchParams(location.search);
  if(q.has('freeze')||q.has('demo')||q.has('nointro')){ if(b.parentNode)b.parentNode.removeChild(b); }
  else{ b.className='gone'; setTimeout(function(){ if(b.parentNode)b.parentNode.removeChild(b); },520); }

  if(q.has('demo')||q.has('freeze')){
    /* the two characters, written for you : the recogniser decides */
    strokes=glyphStrokes();
    inkDirty=true; charge=1;    if(q.has('freeze')){
      DBG=true; STATE='TIDE';
      T=parseFloat(q.get('freeze'))||0.5; charge=1; tsec=4.2;
      wetV=(T<PH.r1)?1.0:Math.max(0,Math.min(1,1-(T-PH.r1)/(1-PH.r1)));
      for(var e=0;e<14;e++) eroStep(0.28);
      prevT=performance.now();
      frame(prevT);
    }else{
      /* no forced tide : the recogniser has to accept the two characters */
    }
  }
  if(!DBG) requestAnimationFrame(frame);
}
try{ boot(); }
catch(err){
  var b=document.getElementById('boot');
  window.__err=String(err&&err.stack||err);
  if(b){ b.className=''; b.style.opacity='1'; }
}
</script>
