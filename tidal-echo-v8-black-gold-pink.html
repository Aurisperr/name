<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Tidal Echo</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden;background:#04070b}
  #stage{position:fixed;inset:0;overflow:hidden;background:#04070b;isolation:isolate}
  #gl{position:absolute;inset:0;width:100%;height:100%;display:block;
      cursor:crosshair;touch-action:none}
  /* the overlay is projected light, not signage : it adds to the picture */
  #scrim{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:.62;
      background:linear-gradient(180deg,rgba(2,5,9,.52),transparent 15%,
                 transparent 80%,rgba(2,5,9,.54))}
  #ui{position:absolute;inset:0;z-index:4;pointer-events:none;
      mix-blend-mode:screen;
      font-family:"SFMono-Regular","Consolas","Liberation Mono",monospace}

  /* ---- corner brackets : the instrument frame ---- */
  .ui-corner{position:absolute;width:26px;height:26px;opacity:.55;
      border-color:rgba(255,96,152,.60);border-style:solid}
  .ui-corner.tl{left:16px;top:16px;border-width:1px 0 0 1px}
  .ui-corner.tr{right:16px;top:16px;border-width:1px 1px 0 0}
  .ui-corner.bl{left:16px;bottom:16px;border-width:0 0 1px 1px}
  .ui-corner.br{right:16px;bottom:16px;border-width:0 1px 1px 0}

  /* ---- datum line : the sea's zero, ruled like an instrument ---- */
  .ui-horizon{position:absolute;left:0;right:0;height:1px;
      background:linear-gradient(90deg,transparent,rgba(255,96,152,.26) 10%,
                 rgba(255,96,152,.26) 90%,transparent)}
  .ui-hz-ticks{position:absolute;left:0;right:0;top:0;height:4px;
      background-image:repeating-linear-gradient(90deg,
                 rgba(255,96,152,.40) 0 1px,transparent 1px 5%)}
  .ui-hz-lbl{position:absolute;left:50%;top:-17px;transform:translateX(-50%);
      font:500 8px/1 "SFMono-Regular",Consolas,monospace;letter-spacing:.32em;
      color:rgba(255,96,152,.52);white-space:nowrap}

  /* ---- acquisition reticle on the sun ---- */
  .ui-reticle{position:absolute;width:var(--rr,90px);height:var(--rr,90px);
      transform:translate(-50%,-50%)}
  .ui-reticle i{position:absolute;inset:0;border:1px dashed rgba(255,96,152,.30);
      border-radius:50%}
  .ui-reticle s{position:absolute;background:rgba(255,96,152,.52)}
  .ui-reticle s.t{left:50%;top:-10px;width:1px;height:8px;margin-left:-.5px}
  .ui-reticle s.b{left:50%;bottom:-10px;width:1px;height:8px;margin-left:-.5px}
  .ui-reticle s.l{top:50%;left:-10px;height:1px;width:8px;margin-top:-.5px}
  .ui-reticle s.r{top:50%;right:-10px;height:1px;width:8px;margin-top:-.5px}
  .ui-reticle em{position:absolute;left:50%;top:50%;width:22px;height:22px;
      transform:translate(-50%,-50%);opacity:.7;
      background:linear-gradient(rgba(255,96,152,.85),rgba(255,96,152,.85)) center/1px 100% no-repeat,
                 linear-gradient(rgba(255,96,152,.85),rgba(255,96,152,.85)) center/100% 1px no-repeat}

  /* ---- bearing marker : the sun's azimuth on the datum line ---- */
  .ui-hz-sun{position:absolute;top:-6px;width:1px;height:13px;
      background:rgba(255,96,152,.85)}
  .ui-hz-sun::after{content:attr(data-az);position:absolute;right:7px;top:0;
      font:500 7.5px/1 "SFMono-Regular",Consolas,monospace;letter-spacing:.24em;
      color:rgba(255,96,152,.72);white-space:nowrap;text-align:right}

  /* ---- vertical data rails ---- */
  .ui-rail{position:absolute;top:17%;bottom:17%;width:9px;opacity:.55;
      background-image:repeating-linear-gradient(180deg,
                 rgba(255,96,152,.26) 0 1px,transparent 1px 15px)}
  .ui-rail.l{left:28px}
  .ui-rail.r{right:28px}

  /* ---- title block ---- */
  .ui-brand{position:absolute;left:clamp(26px,4vw,68px);top:clamp(24px,4.6vh,52px);
      display:flex;align-items:flex-start;gap:14px}
  .ui-mark{width:1px;height:44px;margin-top:3px;background:rgba(255,96,152,.55)}
  .ui-mark::after{content:"";display:block;width:16px;height:1px;
      background:rgba(255,96,152,.85);margin-top:11px}
  .ui-kicker,.ui-meta,.ui-prompt,.ui-coord{
      font:500 8.5px/1.6 "SFMono-Regular","Consolas","Liberation Mono",monospace;
      letter-spacing:.26em;text-transform:uppercase}
  .ui-kicker{color:rgba(255,96,152,.60);margin:0 0 8px}
  .ui-title{font:300 clamp(16px,1.9vw,24px)/1 "Arial Narrow","Helvetica Neue",sans-serif;
      letter-spacing:.42em;text-transform:uppercase;
      color:rgba(240,233,238,.88);margin:0}
  .ui-title span{font-weight:400;color:rgba(255,96,152,.94)}

  /* ---- coordinate readout ---- */
  .ui-coord{position:absolute;right:clamp(26px,4vw,68px);top:clamp(26px,4.8vh,54px);
      color:rgba(198,172,184,.60);text-align:right;line-height:1.95}
  .ui-coord b{display:inline-block;min-width:34px;margin-right:10px;font-weight:500;
      text-align:left;color:rgba(255,96,152,.70)}

  /* ---- status ---- */
  .ui-prompt{position:absolute;left:clamp(26px,4vw,68px);bottom:clamp(26px,4.4vh,48px);
      display:flex;align-items:center;gap:10px;color:rgba(255,138,180,.80)}
  .ui-prompt i{width:7px;height:7px;border:1px solid rgba(255,96,152,.90);
      border-radius:50%;animation:signal 2.6s ease-in-out infinite}
  .ui-prompt strong{font-weight:500;color:rgba(255,214,232,.88)}

  @keyframes signal{0%,100%{opacity:.30;transform:scale(.82)}50%{opacity:1;transform:scale(1)}}
  #boot{position:absolute;inset:0;z-index:20;background:#04070b;
        display:grid;place-items:center;transition:opacity .45s ease}
  #boot i{display:block;width:130px;height:1px;
        background:linear-gradient(90deg,rgba(255,96,152,0),rgba(255,96,152,.60),rgba(255,96,152,0));
        animation:bl 1.8s ease-in-out infinite}
  @keyframes bl{0%,100%{opacity:.12;transform:scaleX(.45)}50%{opacity:.85;transform:scaleX(1)}}
  #boot.gone{opacity:0;pointer-events:none}
  @media (max-width:700px){
    .ui-coord,.ui-rail,.ui-hz-lbl,.ui-hz-sun{display:none}
    .ui-title{font-size:15px;letter-spacing:.30em}
    .ui-prompt{bottom:24px;font-size:8px;letter-spacing:.16em}
    .ui-corner{width:16px;height:16px}
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <div id="scrim"></div>
  <div id="ui" aria-hidden="true">
    <span class="ui-corner tl"></span><span class="ui-corner tr"></span>
    <span class="ui-corner bl"></span><span class="ui-corner br"></span>
    <span class="ui-rail l"></span><span class="ui-rail r"></span>

    <div class="ui-horizon">
      <div class="ui-hz-ticks"></div>
      <div class="ui-hz-lbl">EL 0.000 &nbsp;/&nbsp; SEA DATUM</div>
      <span class="ui-hz-sun"></span>
    </div>

    <div class="ui-reticle"><i></i><s class="t"></s><s class="b"></s>
      <s class="l"></s><s class="r"></s><em></em></div>

    <div class="ui-brand">
      <span class="ui-mark"></span>
      <div>
        <p class="ui-kicker">TE—07 / coastal signal archive</p>
        <h1 class="ui-title">TIDAL <span>ECHO</span></h1>
      </div>
    </div>
    <div class="ui-coord">
      <div><b>LAT</b>31.2304 N</div>
      <div><b>LON</b>121.4737 E</div>
      <div><b>TIDE</b>04.7 M / RISING</div>
    </div>
    <div class="ui-prompt">
      <i></i><span id="ui-status">AWAITING INSCRIPTION</span>
    </div>
  </div>
  <div id="boot"><i></i></div>
</div>
<canvas id="ink" style="display:none"></canvas>

<script>
"use strict";
var glc=document.getElementById('gl');
var gl=glc.getContext('webgl',{antialias:false,alpha:false,depth:false,stencil:false,
  preserveDrawingBuffer:true,powerPreference:'high-performance'});
var DERIV_EXT=gl.getExtension('OES_standard_derivatives');

/* ==================================================================
   TIDAL ECHO
   night beach · write in the sand · the tide keeps no record
   WebGL · no external assets · no text
   ================================================================== */

/* ==================================================================
   1. SHADERS
   ================================================================== */
var VS_SRC = [
"attribute vec2 aPos;",
"varying vec2 vUv;",
"void main(){ vUv=aPos*0.5+0.5; gl_Position=vec4(aPos,0.0,1.0); }"
].join("\n");

/* shared GLSL : noise + THE wave (scene and erosion must agree on it) */
var LIB = [
(DERIV_EXT?"#extension GL_OES_standard_derivatives : enable":""),
"precision highp float;",
"float hash11(float p){ p=fract(p*0.1031); p*=p+33.33; p*=p+p; return fract(p); }",
"float hash21(vec2 p){ vec3 q=fract(vec3(p.xyx)*0.1031); q+=dot(q,q.yzx+33.33); return fract((q.x+q.y)*q.z); }",
"float vnoise(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.0-2.0*f);",
"  return mix(mix(hash21(i),hash21(i+vec2(1.0,0.0)),f.x),",
"             mix(hash21(i+vec2(0.0,1.0)),hash21(i+vec2(1.0,1.0)),f.x),f.y); }",
"float fbm(vec2 p){ float a=0.5,s=0.0; for(int i=0;i<5;i++){ s+=a*vnoise(p); p*=2.03; a*=0.5; } return s; }",
"float fbm3(vec2 p){ float a=0.5,s=0.0; for(int i=0;i<3;i++){ s+=a*vnoise(p); p*=2.07; a*=0.5; } return s; }",
"float fbm2(vec2 p){ float s=0.5*vnoise(p); s+=0.25*vnoise(p*2.07); return s*1.34; }",
/* the single wave that moves the tide line, shapes the sun and breaks its light */
"float waveShape(float x,float t){",
"  return sin(x*13.5+t*2.05)*0.42 + sin(x*34.2-t*3.15)*0.24",
"       + sin(x*7.2+t*1.15)*0.50 + sin(x*81.0+t*5.20)*0.10; }",
"float waveY(float x,float base,float amp,float t){ return base+waveShape(x,t)*amp; }"
].join("\n");

/* ---------- SCENE ---------- */
/* ---------- SCENE ---------- */
var SCENE_SRC = LIB + [
"varying vec2 vUv;",
"uniform vec2  uRes;",
"uniform float uTime, uTide, uWave, uCharge, uFlash, uWet, uHint, uMark;",
"uniform float uShore, uMax, uHorizon;",
"uniform vec2  uSun;",
"uniform float uSunR;",
"uniform vec4  uBox;",
"uniform sampler2D uInk, uEro;",
"uniform vec2  uMouse;",
"uniform float uMouseOn;",
(DERIV_EXT?"float sceneAA(float v){ return max(fwidth(v),1.0/uRes.y); }":"float sceneAA(float v){ return 1.0/uRes.y; }"),

"vec2 boxUv(vec2 uv){ return (uv-uBox.xy)/uBox.zw; }",
"float inkAt(vec2 uv){ vec2 t=boxUv(uv);",
"  if(t.x<0.0||t.x>1.0||t.y<0.0||t.y>1.0) return 0.0;",
"  return texture2D(uInk,t).a; }",
"float eroAt(vec2 uv){ vec2 t=boxUv(uv);",
"  if(t.x<0.0||t.x>1.0||t.y<0.0||t.y>1.0) return 0.0;",
"  return texture2D(uEro,t).r; }",

/* ==================================================================
   THE SUN : a furnace seen through a kilometre of wet air.
   Core, limb darkening, atmospheric veins and a broken reflection share
   the same wave clock with the sea and the sand.
   ================================================================== */
"vec4 sunBody(vec2 uv,float t){",
"  vec2 p=(uv-uSun)*vec2(uRes.x/uRes.y,1.0);",
"  float R=uSunR;",
"  float d=length(p);",
"  float wv=waveShape(p.x*2.0+uSun.x*3.0,t*0.80);",
"  float edge=R*(1.0+0.040*wv);",
"  float disc=1.0-smoothstep(edge-0.020,edge+0.004,d);",
"  float k=clamp(d/edge,0.0,1.0);",
"  float ny=clamp(p.y/edge,-1.0,1.0);",
"  float lat=asin(clamp(ny,-1.0,1.0));",
"  float v=ny*0.5+0.5;",
/* --- the ball : a hot core, a limb that falls away, a lit rim --- */
"  float core=pow(max(1.0-k*k,0.0),0.56);",
"  vec3 hot=vec3(3.05,1.62,0.56);",
"  vec3 bodyc=vec3(1.70,0.64,0.18);",
"  vec3 deep=vec3(0.20,0.030,0.006);",
"  vec3 c=mix(deep,bodyc,smoothstep(0.02,0.48,core));",
"  c=mix(c,hot,smoothstep(0.58,1.0,core));",
/* an off centre glow, the way a sphere catches its own light */
"  float spec=exp(-length(p-vec2(-0.22*edge,0.26*edge))/(edge*0.42));",
"  c+=vec3(2.20,1.20,0.46)*spec*0.24*core;",
/* --- the wave strata follow the latitude, so they curve like a sphere --- */
"  float vh=clamp((uHorizon-(uSun.y-R))/(2.0*R),0.0,1.0);",
"  float fr=fract((lat*2.1-wv*0.020)*20.0+0.5);",
"  float slit=1.0-smoothstep(0.0,0.12,min(fr,1.0-fr));",
"  float depth=0.62*exp(-pow((v-vh)/0.40,2.0));",
"  c*=1.0-slit*depth*0.96;",
"  float crest=1.0-smoothstep(0.0,0.05,abs(fr-0.5));",
"  c+=vec3(1.0,0.68,0.34)*crest*0.18*exp(-pow((v-vh)/0.40,2.0));",
/* a granular surface : it is made of water, not printed on a disc */
"  float grain=0.5;",
"  if(d<edge*1.2) grain=fbm2(p*46.0+vec2(0.0,t*0.22));",
"  c*=0.77+0.27*grain;",
"  float vein=fbm2(vec2(lat*15.0+wv*0.35,lat*3.0+t*0.07));",
"  c*=0.90+0.15*vein;",
/* the foot of the sun is eaten by the swell */
"  float melt=1.0-smoothstep(-1.00,-0.30,ny);",
"  float eat=smoothstep(-0.30,0.30,waveShape(p.x*3.4+4.0,t*1.05));",
"  float erode=clamp(melt*(0.40+0.95*eat),0.0,1.0);",
"  float a=disc*(1.0-erode*0.94);",
/* --- the fresnel rim of a glowing sphere --- */
"  float fres=pow(k,2.6);",
"  c+=vec3(1.0,0.66,0.28)*fres*0.20;",
"  c+=vec3(1.0,0.48,0.16)*fres*0.22;",
"  c+=vec3(1.0,0.20,0.48)*fres*0.30;",
"  c*=0.76;",
/* thin drifting filaments that draw the contour of the sun */
"  float dl=0.0;",
"  if(d<edge*1.7){",
"  for(int i=0;i<3;i++){",
"    float fi=float(i);",
"    float ly=uSun.y+(0.030+fi*0.046)+sin(t*0.11+fi*2.1)*0.005;",
"    float wob=waveShape(uv.x*3.0+fi*1.7,t*0.5)*0.009;",
"    dl+=exp(-pow((uv.y-ly-wob)/0.0010,2.0));",
"  }",
"  }",
"  c+=vec3(1.0,0.58,0.28)*dl*0.070*disc;",
"  c*=1.0-0.10*dl*disc;",
/* limb and a soft spreading light */
"  float rim=exp(-pow((d-edge*0.99)/(edge*0.038),2.0));",
"  vec3 warm=vec3(1.0,0.46,0.15);",
"  float glow=exp(-max(d-edge,0.0)*9.0);",
"  float glow2=exp(-max(d-edge,0.0)*30.0);",
"  float air=exp(-d*2.4);",
"  vec3 halo=warm*glow*0.017+vec3(1.0,0.297,0.556)*glow2*0.012+vec3(1.0,0.24,0.50)*glow*0.021+warm*air*0.006;",
"  return vec4(c*a+rim*vec3(1.0,0.297,0.556)*0.11+halo,a);",
"}",
"",
/* only the air around the sun : it bleeds in front of the city, the disc does not */
"vec3 sunGlow(vec2 uv,float t){",
"  vec2 p=(uv-uSun)*vec2(uRes.x/uRes.y,1.0);",
"  float d=length(p);",
"  float R=uSunR;",
"  float glow=exp(-max(d-R,0.0)*7.5);",
"  float glow2=exp(-max(d-R,0.0)*26.0);",
"  float air=exp(-d*2.2);",
"  return vec3(1.0,0.46,0.14)*glow*0.0048+vec3(1.0,0.293,0.550)*glow2*0.0040+vec3(1.0,0.24,0.50)*glow*0.0058",
"        +vec3(1.0,0.46,0.14)*air*0.0030;",
"}",

/* the light column breathes with the same swell that moves the tide */
"float swellPulse(vec2 uv,float t,float dep){",
"  float ph=waveShape(uv.x*1.6+2.0,t*0.85);",
"  float beat=0.5+0.5*sin(dep*17.0-t*2.1+ph*1.8);",
"  float crest=smoothstep(-0.25,0.55,ph);",
"  return (0.26+0.92*beat)*(0.46+0.80*crest);",
"}",

/* ---- the glitter path : the sun's own swell, laid on the water ---- */
"float sunPath(vec2 uv,float t,float dep){",
"  float bend=sin(dep*27.0-t*0.62)*0.0045*(0.25+dep*2.4)",
"            +(fbm2(vec2(dep*8.0+t*0.055,2.7))-0.48)*0.018*(0.18+dep*1.35);",
"  float cx=uSun.x+bend-dep*0.040-dep*dep*0.016;",
"  float dx=uv.x-cx;",
"  float pw=(0.014+dep*0.26)*(0.72+0.38*fbm2(vec2(dep*10.0-t*0.035,6.1)));",
"  float sideScale=dx<0.0?0.78:1.08;",
"  float inPath=1.0-smoothstep(pw*0.16,pw,abs(dx)*sideScale);",
"  if(inPath<=0.0) return 0.0;",
"  float cellX=0.0034+dep*0.021;",
"  float cellY=0.0019+dep*0.0105;",
"  vec2 q=vec2(dx/cellX+(fbm2(vec2(dep*44.0,dx*18.0))-0.5)*1.10,",
"              (dep*dep*4.0+dep*0.72)/cellY);",
"  q.y+=(fbm2(vec2(dx*27.0,dep*73.0-t*0.13))-0.5)*1.70+sin(q.x*0.41+t*0.18)*0.32;",
"  vec2 id=floor(q);",
"  vec2 cf=fract(q)-0.5;",
"  float h=hash21(id+vec2(dx<0.0?7.3:19.1,3.7));",
"  vec2 jit=vec2(hash21(id+4.1),hash21(id+8.6))-0.5;",
"  float stretch=0.30+0.22*hash11(id.y*2.9+1.0);",
"  float d=length(vec2((cf.x-jit.x*0.58)*stretch,(cf.y-jit.y*0.34)*2.15));",
"  float sp=1.0-smoothstep(0.045,0.185,d);",
"  float on=step(0.48,h);",
"  float cut=smoothstep(0.26,0.68,fbm2(vec2(dx*31.0+dep*8.0,dep*118.0-t*0.14)));",
"  float core=exp(-pow(dx/(pw*0.32),2.0));",
"  float wide=exp(-pow(dx/(pw*0.62),2.0))*smoothstep(0.37,0.68,fbm2(vec2(dx*51.0+dep*17.0,dep*155.0-t*0.11)));",
"  float ripple=pow(0.5+0.5*sin(dep*96.0+sin(dx/max(pw,0.001)*3.2+t*0.26)*0.72),7.0);",
"  float bar=ripple*inPath*smoothstep(0.30,0.72,cut)*0.055;",
"  float amp=smoothstep(0.0,0.012,dep);",
"  float asym=0.68+0.48*smoothstep(-pw,pw,dx);",
"  float flicker=0.84+0.16*sin(t*0.46+dep*76.0);",
"  return inPath*amp*asym*flicker*(sp*on*(0.36+1.05*cut)+core*0.10*(0.55+0.45*cut)+wide*0.12+bar);",
"}",,

/* a dot matrix display : only round pixels, never any letter */
"float dotMatrix(vec2 p,float cell,float seed){",
"  vec2 g=floor(p/cell);",
"  vec2 f=fract(p/cell)-0.5;",
"  float on=step(0.56,hash21(vec2(g.x+seed*7.0,g.y-floor(uTime*2.6))));",
"  return (1.0-smoothstep(0.13,0.30,length(f)))*on;",
"}",
/* the neon frame of a panel */
"float rectFrame(vec2 p,vec2 lo,vec2 hi,float w){",
"  vec2 d=min(p-lo,hi-p);",
"  float e=min(d.x,d.y);",
"  float inr=step(0.0,d.x)*step(d.y,0.0);",
"  return inr*(1.0-smoothstep(0.0,w,e));",
"}",

/* the rain landing on a surface : a ring that opens and a small flash */
,

/* the night sky : ink-blue zenith, oxidized copper haze, hot sodium
   near the horizon. The striations are atmospheric, not wallpaper. */
/* Stars are what keeps the upper frame from reading as a painted wash.
   They are sparse, cold and mostly still : a field of pinpricks, not sparkle. */
"float starField(vec2 uv,float t){",
"  vec2 p=vec2(uv.x*uRes.x/uRes.y,uv.y);",
"  vec2 g=p*190.0;",
"  vec2 id=floor(g);",
"  vec2 f=fract(g)-0.5;",
"  float h=hash21(id);",
"  float on=step(0.9765,h);",
"  float tw=0.62+0.38*sin(t*(0.7+h*4.0)+h*57.0);",
"  float s=(1.0-smoothstep(0.0,0.36,length(f)))*on*tw;",
"  return s*(0.30+0.70*h);",
"}",
"vec3 skyStrata(vec2 uv,float t){",
"  float above=max(uv.y-uHorizon,0.0);",
/* The screen ruling is an absorbing texture, not emissive neon. */
"  float warp=fbm2(vec2(uv.x*0.72+2.0,uv.y*0.58))*1.8;",
"  float yb=(uv.y-uHorizon)*22.0-t*0.010+warp*0.45;",
"  float broad=1.0-smoothstep(0.02,0.18,abs(fract(yb)-0.5));",
"  float paper=0.978+0.022*fbm2(vec2(uv.x*34.0+4.0,uv.y*53.0));",
"  float grain=0.972+0.028*fbm2(vec2(uv.x*92.0+3.0,uv.y*310.0+t*0.006));",
"  float ink=broad*exp(-above*1.5)*0.022;",
"  vec3 shade=mix(vec3(1.0),vec3(0.93,0.86,0.89),ink);",
"  return shade*paper*mix(vec3(1.0),vec3(grain),0.45);",
"}",
"float sunShafts(vec2 uv,float t){",
"  vec2 p=(uv-uSun)*vec2(uRes.x/uRes.y,1.0);",
"  float d=length(p);",
"  float a=atan(p.y,p.x);",
"  float s=0.0;",
"  for(int i=0;i<4;i++){",
"    float fi=float(i);",
"    float ang=hash11(fi*3.7+1.0)*6.2831+sin(t*0.035+fi*1.7)*0.10;",
"    float wdt=0.035+0.030*hash11(fi*5.1+2.0);",
"    s+=exp(-pow((a-ang)/wdt,2.0))*(0.55+0.45*hash11(fi*7.3+3.0));",
"  }",
"  float cut=1.0-smoothstep(uSunR*1.03,uSunR*1.48,d);",
"  return s*exp(-d*2.2)*cut;",
"}",
"vec3 airTraffic(vec2 uv,float t){",
"  vec3 c=vec3(0.0);",
"  float asp=uRes.x/uRes.y;",
"  for(int i=0;i<7;i++){",
"    float fi=float(i);",
"    float dir=i<4?1.0:-1.0;",
"    float speed=0.012+0.026*hash11(fi*5.3+2.0);",
"    float phase=fract(hash11(fi*8.1+4.0)+t*speed);",
"    float x=dir>0.0?mix(-0.08,1.08,phase):mix(1.08,-0.08,phase);",
"    float y=uHorizon+0.105+fi*0.040+0.006*sin(t*0.045+fi*2.7);",
"    y+=0.004*sin(x*9.0+t*0.12+fi);",
"    float sideW=0.0060+0.0016*hash11(fi*3.1+7.0);",
"    float sideH=0.00145+0.00025*hash11(fi*7.7+2.0);",
"    float edgeX=1.0-smoothstep(sideW-0.00020,sideW+0.00020,abs((uv.x-x)*asp));",
"    float edgeY=1.0-smoothstep(sideH-0.00018,sideH+0.00018,abs(uv.y-y));",
"    float lower=(1.0-smoothstep(0.42,0.92,abs(uv.y-(y-sideH))*uRes.y))*edgeX;",
"    float canopy=(1.0-smoothstep(0.42,0.92,abs(uv.y-(y+sideH*0.45))*uRes.y))",
"                *(1.0-smoothstep(sideW*0.50,sideW*0.55,abs((uv.x-x)*asp)));",
"    float back=(x-uv.x)*dir;",
"    float tailGate=step(0.0,back)*(1.0-smoothstep(0.012,0.078,back));",
"    float tailLine=(1.0-smoothstep(0.42,0.92,abs(uv.y-(y-sideH*0.72))*uRes.y))*tailGate;",
"    float tailDash=step(0.22,fract(back*68.0+t*0.08));",
"    vec3 tint=(i==0||i==3)?vec3(1.0,0.32,0.56):vec3(1.0,0.308,0.574);",
"    c+=tint*(edgeX*edgeY*0.18+lower*0.66+canopy*0.22+tailLine*tailDash*0.24);",
"  }",
"  for(int j=0;j<3;j++){",
"    float fj=float(j);",
"    float x=0.33+fj*0.19+0.010*sin(t*0.07+fj*2.0);",
"    float y=uHorizon+0.075+fj*0.022+0.004*sin(t*0.31+fj);",
"    float dw=1.0-smoothstep(0.0011,0.00145,abs((uv.x-x)*asp));",
"    float dh=1.0-smoothstep(0.00055,0.00085,abs(uv.y-y));",
"    float mast=(1.0-smoothstep(0.38,0.82,abs(uv.x-x)*uRes.x))",
"              *step(y-0.008,uv.y)*step(uv.y,y);",
"    float foot=(1.0-smoothstep(0.38,0.82,abs(uv.y-(y-0.008))*uRes.y))",
"              *step(abs((uv.x-x)*asp),0.0014);",
"    c+=vec3(1.0,0.293,0.550)*(dw*dh*0.34+dw*dh*0.08)+vec3(0.16,0.36,0.58)*(mast*0.20+foot*0.10);",
"  }",
"  for(int l=0;l<2;l++){",
"    float fl=float(l);",
"    float ly=uHorizon+0.175+fl*0.135+0.004*sin(uv.x*7.5+t*0.025+fl*2.0);",
"    float lane=1.0-smoothstep(0.45,0.95,abs(uv.y-ly)*uRes.y);",
"    float dash=step(0.60,fract(uv.x*(15.0+fl*5.0)+t*(0.020+fl*0.012)));",
"    float gate=smoothstep(0.18,0.23,uv.x)*(1.0-smoothstep(0.88,0.93,uv.x));",
"    vec3 laneC=fl<0.5?vec3(1.0,0.289,0.544):vec3(1.0,0.32,0.56);",
"    c+=laneC*lane*dash*gate*0.032;",
"  }",
"  return c;",
"}",
/* dark vehicle shells sit under the moving lights, so traffic reads as traffic */
"float airTrafficBody(vec2 uv,float t){",
"  float mask=0.0;",
"  float asp=uRes.x/uRes.y;",
"  for(int i=0;i<7;i++){",
"    float fi=float(i);",
"    float dir=i<4?1.0:-1.0;",
"    float speed=0.012+0.026*hash11(fi*5.3+2.0);",
"    float phase=fract(hash11(fi*8.1+4.0)+t*speed);",
"    float x=dir>0.0?mix(-0.08,1.08,phase):mix(1.08,-0.08,phase);",
"    float y=uHorizon+0.105+fi*0.040+0.006*sin(t*0.045+fi*2.7);",
"    y+=0.004*sin(x*9.0+t*0.12+fi);",
"    float sideW=0.0060+0.0016*hash11(fi*3.1+7.0);",
"    float sideH=0.00145+0.00025*hash11(fi*7.7+2.0);",
"    float shell=1.0-smoothstep(sideW-0.00028,sideW+0.00028,abs((uv.x-x)*asp));",
"    shell*=1.0-smoothstep(sideH-0.00024,sideH+0.00024,abs(uv.y-y));",
"    float canopy=1.0-smoothstep(sideW*0.54,sideW*0.58,abs((uv.x-x)*asp));",
"    canopy*=1.0-smoothstep(sideH*0.52,sideH*0.57,abs(uv.y-(y+sideH*0.46)));",
"    mask=max(mask,max(shell,canopy*0.72)*0.58);",
"  }",
"  for(int j=0;j<3;j++){",
"    float fj=float(j);",
"    float x=0.33+fj*0.19+0.010*sin(t*0.07+fj*2.0);",
"    float y=uHorizon+0.075+fj*0.022+0.004*sin(t*0.31+fj);",
"    float block=1.0-smoothstep(0.0010,0.00120,abs((uv.x-x)*asp));",
"    block*=1.0-smoothstep(0.00050,0.00075,abs(uv.y-y));",
"    mask=max(mask,block*0.42);",
"  }",
"  return mask;",
"}",
/* a lone patrol skiff gives the sea a believable scale cue */
"vec4 seaCraft(vec2 uv,float t){",
"  float x=0.785+0.004*sin(t*0.055);",
"  float y=uHorizon-0.022+0.0008*sin(t*0.62);",
"  float hull=step(abs(uv.x-x),0.0155)*step(abs(uv.y-y),0.0032);",
"  float deck=step(abs(uv.x-x+0.001),0.0105)*step(abs(uv.y-(y+0.0042)),0.0021);",
"  float cabin=step(abs(uv.x-x+0.0015),0.0042)*step(abs(uv.y-(y+0.0082)),0.0034);",
"  float body=max(hull,max(deck,cabin));",
"  vec3 col=mix(vec3(0.026,0.021,0.030),vec3(0.090,0.042,0.070),hull);",
"  float mast=step(abs(uv.x-(x-0.002)),0.00040)*step(y+0.009,uv.y)*step(uv.y,y+0.021);",
"  col=mix(col,vec3(0.20,0.12,0.18),mast);",
"  body=max(body,mast);",
"  vec2 redP=vec2((uv.x-(x-0.010))*uRes.x/uRes.y,uv.y-y);",
"  vec2 cyanP=vec2((uv.x-(x+0.010))*uRes.x/uRes.y,uv.y-y);",
"  float redBox=1.0-smoothstep(0.0011,0.00145,abs(redP.x));",
"  redBox*=1.0-smoothstep(0.00055,0.00080,abs(redP.y));",
"  float cyanBox=1.0-smoothstep(0.0011,0.00145,abs(cyanP.x));",
"  cyanBox*=1.0-smoothstep(0.00055,0.00080,abs(cyanP.y));",
"  float redLine=(1.0-smoothstep(0.38,0.82,abs(redP.y)*uRes.y))",
"               *step(abs(redP.x),0.00155);",
"  float cyanLine=(1.0-smoothstep(0.38,0.82,abs(cyanP.y)*uRes.y))",
"                *step(abs(cyanP.x),0.00155);",
"  float hullLine=(1.0-smoothstep(0.38,0.82,abs(uv.y-(y-0.0030))*uRes.y))",
"                 *step(abs(uv.x-x),0.0145);",
"  float wakeX=(x-0.010)-uv.x;",
"  float wakeGate=step(0.0,wakeX)*(1.0-smoothstep(0.0,0.085,wakeX));",
"  float wake=(1.0-smoothstep(0.42,0.92,abs(uv.y-(y+0.004+0.003*sin(uv.x*130.0+t*1.5)))*uRes.y))",
"            *wakeGate*smoothstep(0.22,0.78,fbm2(vec2(uv.x*95.0,t*0.12)));",
"  col+=vec3(1.0,0.26,0.52)*(redBox*0.76+redLine*0.92);",
"  col+=vec3(0.12,0.58,0.82)*(cyanBox*0.72+cyanLine*0.90);",
"  col+=vec3(0.34,0.50,0.76)*hullLine*0.26;",
"  col+=mix(vec3(0.30,0.15,0.24),vec3(0.95,0.30,0.55),0.35)*wake*0.26;",
"  float alpha=max(body*0.88,max(redBox,cyanBox)*0.70);",
"  alpha=max(alpha,max(redLine,cyanLine)*0.92);",
"  alpha=max(alpha,max(hullLine*0.26,wake*0.12));",
"  return vec4(col,clamp(alpha,0.0,1.0));",
"}",
"vec3 searchLights(vec2 uv,float t){",
"  vec3 c=vec3(0.0);",
"  float asp=uRes.x/uRes.y;",
"  for(int i=0;i<2;i++){",
"    float fi=float(i);",
"    vec2 o=vec2(i==0?0.205:0.842,uHorizon-0.004);",
"    vec2 p=vec2((uv.x-o.x)*asp,uv.y-o.y);",
"    float a=(i==0?1.25:1.88)+sin(t*0.032+fi*2.2)*0.065;",
"    vec2 dir=vec2(cos(a),sin(a));",
"    float along=dot(p,dir);",
"    float across=abs(dot(p,vec2(-dir.y,dir.x)));",
"    float wdt=0.0045+max(along,0.0)*0.045;",
"    float beam=exp(-pow(across/wdt,2.0));",
"    float body=smoothstep(0.0,0.025,along)*exp(-max(along,0.0)*12.0)",
"              *(1.0-smoothstep(0.085,0.210,along));",
"    float baseGlow=exp(-pow((uv.x-o.x)*asp/0.025,2.0)",
"                     -pow((uv.y-o.y)/0.010,2.0));",
"    vec3 tint=i==0?vec3(1.0,0.301,0.562):vec3(1.0,0.32,0.56);",
"    c+=tint*(beam*body*(0.007+0.002*sin(t*0.12+fi))+baseGlow*0.010);",
"  }",
"  return c;",
"}",
,
"vec3 cloudStrata(vec2 uv,float t){",
"  vec3 c=vec3(0.0);",
"  float azx=exp(-pow((uv.x-uSun.x)/0.45,2.0));",
"  for(int L=0;L<2;L++){",
"    float fl=float(L);",
"    float yb=uHorizon+0.085+fl*0.185;",
"    float n=fbm3(vec2(uv.x*2.8+fl*9.0+t*0.010,fl*5.0+t*0.004));",
"    float band=smoothstep(0.44,0.86,n)*exp(-pow((uv.y-yb)/(0.055+fl*0.03),2.0));",
"    vec3 cc=mix(vec3(0.022,0.015,0.026),vec3(0.070,0.046,0.048),azx);",
"    c+=cc*band*(1.0-fl*0.30)*0.82;",
"  }",
"  return c;",
"}",

/* ==================================================================
   THE SKYLINE : boxes with volume, setbacks, windows, neon and haze
   ================================================================== */
/* Three near-field landmarks break the procedural rhythm and give the eye
   something to scale the city against. Their warm windows are deliberately
   sparse; most of the architecture remains silhouette. */
"vec4 legacyLandmarkCity(vec2 uv,float t){",
"  vec3 body=vec3(0.0);",
"  vec3 em=vec3(0.0);",
"  float mask=0.0;",
"  for(int i=0;i<3;i++){",
"    float fi=float(i);",
"    float cx=i==0?0.105:(i==1?0.895:0.305);",
"    float hw=i==0?0.031:(i==1?0.025:0.016);",
"    float hgt=i==0?0.205:(i==1?0.158:0.112);",
"    float dx=abs(uv.x-cx);",
"    float top=uHorizon+hgt;",
"    float taper=mix(1.0,0.82,smoothstep(top-0.052,top-0.010,uv.y));",
"    float crown=step(dx,hw*0.46)*step(top-0.014,uv.y)*step(uv.y,top+0.004);",
"    float shoulder=step(dx,hw*1.18)*step(uHorizon,uv.y)*step(uv.y,uHorizon+hgt*0.33);",
"    float tower=step(dx,hw*taper)*step(uHorizon,uv.y)*step(uv.y,top);",
"    tower=max(tower,crown);",
"    float m=max(shoulder,tower);",
"    if(m>0.5){",
"      float u=clamp((uv.x-(cx-hw))/(2.0*hw),0.0,1.0);",
"      float side=mix(0.55,1.0,smoothstep(0.12,0.88,u));",
"      vec3 bc=vec3(0.0012,0.0024,0.0042)+vec3(0.0022,0.0040,0.0068)*side;",
"      bc+=vec3(0.0008,0.0045,0.0080)*exp(-pow((uv.x-cx)/hw,2.0))*0.65;",
"      float rib=smoothstep(0.24,0.52,abs(fract(u*7.0+0.12)-0.5));",
"      float floorLine=smoothstep(0.44,0.49,abs(fract((top-uv.y)/0.0072)-0.5));",
"      float topShade=0.36+0.64*smoothstep(0.0,0.075,top-uv.y);",
"      bc*=topShade*(0.62+0.38*rib)*(0.84+0.16*floorLine);",
"      vec2 wc=floor(vec2(u*13.0,(top-uv.y)/0.0072));",
"      vec2 wf=fract(vec2(u*13.0,(top-uv.y)/0.0072));",
"      float glass=step(0.24,wf.x)*step(wf.x,0.72)*step(0.24,wf.y)*step(wf.y,0.68);",
"      float lit=step(0.86,hash21(wc+fi*37.0));",
"      float sleep=step(0.58,fract(t*(0.035+0.10*hash11(wc.y+fi*9.0))+hash11(wc.x+3.0)));",
"      float wrg=hash21(wc+fi*11.0);",
"      vec3 win=mix(vec3(1.0,0.301,0.562),vec3(1.0,0.30,0.55),step(0.55,wrg)*step(wrg,0.84));",
"      win=mix(win,vec3(1.0,0.62,0.30),step(0.84,wrg));",
"      em+=win*glass*lit*sleep*(0.28+0.48*side);",
"      float edge=1.0-smoothstep(0.0,0.0014,abs(dx-hw*taper));",
"      em+=vec3(1.0,0.282,0.532)*edge*0.17;",
"      float strip=1.0-smoothstep(0.0,0.0014,abs(u-0.78));",
"      em+=mix(vec3(1.0,0.30,0.55),vec3(1.0,0.293,0.550),step(0.67,fi))*strip*0.26;",
"      float mast=1.0-smoothstep(0.0,0.00055,abs(uv.x-cx))*step(top-0.001,uv.y)*step(uv.y,top+0.034+fi*0.008);",
"      em+=vec3(0.42,0.20,0.22)*mast*0.35;",
"      float beacon=1.0-smoothstep(0.0,0.0015,length((uv-vec2(cx,top+0.037+fi*0.008))*vec2(1.0,0.45)));",
"      em+=vec3(1.0,0.36,0.08)*beacon*(0.25+0.75*step(0.55,sin(t*2.7+fi*2.3)));",
"      body=mix(body,bc/max(m,0.001),m);",
"      mask=max(mask,m);",
"    }",
"  }",
"  return vec4(body+em,mask);",
"}",
"vec4 heroTower(vec2 uv,float t,float id){",
"  float cx=id<0.5?0.082:(id<1.5?0.205:(id<2.5?0.862:0.955));",
"  float fw=id<0.5?0.030:(id<1.5?0.019:(id<2.5?0.037:0.024));",
"  float hgt=id<0.5?0.205:(id<1.5?0.115:(id<2.5?0.176:0.135));",
"  float sideW=fw*(0.34+0.12*hash11(id*6.3+4.0));",
"  float top=uHorizon+hgt;",
"  float aa=1.15/max(uRes.y,1.0);",
"  float frontL=cx-fw,frontR=cx+fw,sideR=frontR+sideW;",
/* keep the detailed facade work inside each landmark's coarse silhouette */
"  if(uv.x<frontL-0.010||uv.x>sideR+0.010||uv.y<uHorizon-aa||uv.y>top+0.070) return vec4(0.0);",
"  float frontMask=smoothstep(frontL-aa,frontL+aa,uv.x)*(1.0-smoothstep(frontR-aa,frontR+aa,uv.x))",
"                *smoothstep(uHorizon-aa,uHorizon+aa,uv.y)*(1.0-smoothstep(top-aa,top+aa,uv.y));",
"  float sideU=clamp((uv.x-frontR)/max(sideW,0.001),0.0,1.0);",
"  float sideTop=top-(0.003+0.012*hash11(id*7.1+3.0))*sideU;",
"  float sideMask=smoothstep(frontR-aa,frontR+aa,uv.x)*(1.0-smoothstep(sideR-aa,sideR+aa,uv.x))",
"               *smoothstep(uHorizon-aa,uHorizon+aa,uv.y)*(1.0-smoothstep(sideTop-aa,sideTop+aa,uv.y));",
"  float shoulderW=fw*(1.14+0.14*hash11(id*9.0+2.0));",
"  float shoulderTop=uHorizon+hgt*(0.18+0.08*hash11(id*4.0+8.0));",
"  float shoulderMask=smoothstep(cx-shoulderW-aa,cx-shoulderW+aa,uv.x)",
"                    *(1.0-smoothstep(cx+shoulderW-aa,cx+shoulderW+aa,uv.x))",
"                    *smoothstep(uHorizon-aa,uHorizon+aa,uv.y)*(1.0-smoothstep(shoulderTop-aa,shoulderTop+aa,uv.y));",
"  float crownW=fw*(0.48+0.16*hash11(id*3.6+1.0));",
"  float crownTop=top+(0.008+0.018*hash11(id*2.2+5.0));",
"  float crownMask=smoothstep(cx-crownW-aa,cx-crownW+aa,uv.x)",
"                  *(1.0-smoothstep(cx+crownW-aa,cx+crownW+aa,uv.x))",
"                  *smoothstep(top-aa,top+aa,uv.y)*(1.0-smoothstep(crownTop-aa,crownTop+aa,uv.y));",
"  float roofMask=smoothstep(frontL-0.002-aa,frontL-0.002+aa,uv.x)",
"                *(1.0-smoothstep(sideR+0.002-aa,sideR+0.002+aa,uv.x))",
"                *smoothstep(top-aa,top+aa,uv.y)*(1.0-smoothstep(top+0.0038-aa,top+0.0038+aa,uv.y));",
"  float m=max(max(frontMask,sideMask),max(shoulderMask,crownMask));",
"  m=max(m,roofMask);",
/* an early rejection prevents four full facade evaluations per screen pixel */
"  if(m<0.001) return vec4(0.0);",
"  float onSide=smoothstep(frontR-aa,frontR+aa,uv.x);",
"  float frontU=clamp((uv.x-frontL)/max(2.0*fw,0.001),0.0,1.0);",
"  float vertical=clamp((uv.y-uHorizon)/max(hgt,0.001),0.0,1.0);",
"  float rib=1.0-smoothstep(0.025,0.055,abs(fract(frontU*8.0+0.11)-0.5));",
"  float floorLine=1.0-smoothstep(0.035,0.075,abs(fract((top-uv.y)/0.0105)-0.5));",
"  vec3 front=vec3(0.0058,0.0050,0.0074)+vec3(0.0068,0.0028,0.0058)*frontU;",
"  front*=0.63+0.37*vertical;",
"  front*=0.82+0.18*rib;",
"  front*=0.88+0.12*floorLine;",
"  vec3 side=vec3(0.0088,0.0048,0.0100)+vec3(0.0062,0.0030,0.0068)*(1.0-sideU);",
"  side*=0.54+0.46*vertical;",
"  vec3 bc=mix(front,side,onSide);",
"  bc=mix(bc,vec3(0.015,0.008,0.022),roofMask*0.72);",
"  bc=mix(bc,front*0.76,shoulderMask*(1.0-onSide));",
"  bc=mix(bc,vec3(0.010,0.006,0.012),crownMask);",
"  vec3 em=vec3(0.0);",
"  vec2 wg=vec2(frontU*14.0,(top-uv.y)/0.0108);",
"  vec2 wc=floor(wg),wf=fract(wg);",
"  float glass=step(0.29,wf.x)*step(wf.x,0.73)*step(0.31,wf.y)*step(wf.y,0.70);",
"  float lit=smoothstep(0.73,0.83,hash21(wc+id*50.0+3.1));",
"  float wrh=hash21(wc+id*11.0);",
"  vec3 winCol=mix(vec3(1.0,0.304,0.568),vec3(1.0,0.30,0.55),step(0.58,wrh)*step(wrh,0.86));",
"  winCol=mix(winCol,vec3(1.0,0.62,0.28),step(0.86,wrh));",
"  float pulse=0.72+0.28*sin(t*(0.34+0.28*hash11(wc.y+id))+hash11(wc.x+id)*5.0);",
"  em+=winCol*glass*lit*pulse*(1.0-onSide)*(0.15+0.13*vertical);",
"  vec2 swg=vec2(sideU*7.0,(sideTop-uv.y)/0.0125);",
"  vec2 swc=floor(swg),swf=fract(swg);",
"  float sideGlass=step(0.34,swf.x)*step(swf.x,0.68)*step(0.37,swf.y)*step(swf.y,0.68);",
"  em+=mix(vec3(1.0,0.30,0.56),vec3(1.0,0.297,0.556),step(0.48,hash21(swc+id*5.0)))",
"     *sideGlass*step(0.74,hash21(swc+id*23.0))*onSide*0.10;",
"  float leftEdge=1.0-smoothstep(0.0,0.0012,abs(uv.x-frontL))*step(uHorizon,uv.y)*step(uv.y,top);",
"  float rightEdge=1.0-smoothstep(0.0,0.0012,abs(uv.x-frontR))*step(uHorizon,uv.y)*step(sideTop,uv.y);",
"  float backEdge=1.0-smoothstep(0.0,0.0013,abs(uv.x-sideR))*step(uHorizon,uv.y)*step(sideTop,uv.y);",
"  float roofEdge=1.0-smoothstep(0.0,0.0014,abs(uv.y-top))*step(frontL,uv.x)*step(uv.x,sideR);",
"  em+=vec3(1.0,0.54,0.20)*leftEdge*0.115;",
"  em+=vec3(1.0,0.301,0.562)*rightEdge*0.055;",
"  em+=vec3(1.0,0.52,0.18)*backEdge*0.13;",
"  em+=vec3(1.0,0.308,0.574)*roofEdge*0.15;",
"  float bandY=uHorizon+hgt*(0.52+0.16*hash11(id*12.0+1.0));",
"  float band=exp(-pow((uv.y-bandY)/0.0019,2.0))*step(frontL,uv.x)*step(uv.x,frontR);",
"  float bandBreak=0.45+0.55*smoothstep(0.30,0.72,fbm2(vec2(uv.x*27.0+id*9.0,t*0.035)));",
"  em+=mix(vec3(1.0,0.30,0.56),vec3(1.0,0.297,0.556),step(0.62,hash11(id*8.0+3.0)))*band*bandBreak*0.13;",
/* Holographic advertising is recessed into the facade, never a free-standing light column. */
"  float adOn=clamp(step(id,0.35)+step(1.65,id),0.0,1.0);",
"  float adW=fw*0.66,adH=0.020+0.006*hash11(id*5.0+2.0);",
"  float adX=cx+fw*(0.03+0.08*hash11(id*3.0+7.0));",
"  float adY=uHorizon+hgt*(0.44+0.13*hash11(id*4.0+4.0));",
"  vec2 ap=abs(vec2((uv.x-adX)/adW,(uv.y-adY)/adH));",
"  float adPanel=step(ap.x,1.0)*step(ap.y,1.0)*adOn;",

"  float adScan=0.52+0.48*pow(0.5+0.5*sin((uv.y-adY)*290.0-t*4.2),8.0);",
"  float adBars=step(0.30,fract((uv.x-adX)/0.0042))*step(fract((uv.y-adY+adH)/0.0055),0.52);",
"  em+=mix(vec3(1.0,0.30,0.56),vec3(1.0,0.297,0.556),step(0.5,hash11(id*17.0)))",
"     *adPanel*(0.026+0.105*adScan*adBars);",
"  em+=vec3(1.0,0.301,0.562)*adFrame*0.22;",
"  float mastX=cx+fw*0.34;",
"  float mastH=0.018+0.026*hash11(id*2.7+6.0);",
"  float mast=step(0.58,hash11(id*5.1+9.0))*(1.0-smoothstep(0.00035,0.00075,abs(uv.x-mastX)))",
"             *step(crownTop-0.001,uv.y)*step(uv.y,crownTop+mastH);",
"  em+=vec3(0.44,0.22,0.30)*mast*0.38;",
"  float beacon=1.0-smoothstep(0.0,0.0015,length((uv-vec2(mastX,crownTop+mastH))*vec2(1.0,0.42)));",
"  em+=vec3(1.0,0.36,0.08)*beacon*step(0.58,hash11(id*5.1+9.0))",
"     *(0.20+0.80*step(0.52,sin(t*2.55+id*1.7)));",

"}",

"vec4 cityLayer(vec2 uv,float t){",
"  vec3 col=vec3(0.0);",
"  vec3 airLights=vec3(0.0);",
"  float has=0.0;",
"  float asp=uRes.x/uRes.y;",
"  float sunGap=(uSunR+0.014)/asp;",
"  float gapL=uSun.x-sunGap, gapR=uSun.x+sunGap;",
/* Far, middle and near fields use radically different scales. Reducing the
   field count is what restores negative space and makes the city legible. */
"  for(int i=0;i<3;i++){",
"    float fi=float(i);",
"    float nearness=fi*0.5;",
"    float dens=i==0?9.2:(i==1?5.9:4.0);",
"    float px=uv.x*dens;",
"    float cell=floor(px);",
"    float fx=fract(px);",
"    float r1=hash11(cell*7.7+fi*19.0+3.0);",
"    float r2=hash11(cell*2.3+fi*31.0+7.0);",
"    float r3=hash11(cell*13.7+fi*11.0+1.0);",
"    float r4=hash11(cell*31.1+fi*5.0+9.0);",
"    float present=step(i==0?0.16:0.26,hash11(cell*4.9+fi*23.0+2.0));",
"    float bw=i==0?(0.44+0.28*r3):(i==1?(0.36+0.22*r3):(0.40+0.22*r3));",
"    float bx=i==0?(0.07+0.11*r4):(i==1?(0.07+0.12*r4):(0.08+0.10*r4));",
"    float sideW=bw*(0.13+0.13*r2);",
"    float hgt=i==0?(0.014+pow(r1,1.7)*0.052):(i==1?(0.038+pow(r1,1.65)*0.090):(0.055+pow(r1,1.8)*0.108));",
"    hgt+=i>0&&r2>0.84?0.030+0.040*r3:0.0;",
"    float roof=uHorizon+hgt;",
"    float bL=(cell+bx)/dens, bR=(cell+bx+bw+sideW)/dens;",
"    float sunSkip=step(gapL,bR)*step(bL,gapR);",
"    float aa=1.2/max(uRes.y,1.0);",
"    float edgeL=smoothstep(bx-aa,bx+aa,fx);",
"    float edgeR=1.0-smoothstep(bx+bw-aa,bx+bw+aa,fx);",
"    float baseMask=edgeL*edgeR*step(uHorizon-0.002,uv.y)*(1.0-smoothstep(roof-aa,roof+aa,uv.y));",
"    float sideRoof=roof-(0.006+0.022*r2)*clamp((fx-(bx+bw))/max(sideW,0.001),0.0,1.0);",
"    float sideMask=smoothstep(bx+bw-aa,bx+bw+aa,fx)*(1.0-smoothstep(bx+bw+sideW-aa,bx+bw+sideW+aa,fx))*step(uHorizon-0.002,uv.y)*(1.0-smoothstep(sideRoof-aa,sideRoof+aa,uv.y));",
"    float capW=bw*(0.40+0.25*r2);",
"    float capX=bx+(bw-capW)*(0.25+0.50*r3);",
"    float capTop=roof+(0.006+0.024*r1)*step(0.58,r2);",
"    float capMask=smoothstep(capX-aa,capX+aa,fx)*(1.0-smoothstep(capX+capW-aa,capX+capW+aa,fx))*step(roof-aa,uv.y)*(1.0-smoothstep(capTop-aa,capTop+aa,uv.y));",
"    float ventW=bw*(0.10+0.11*r3);",
"    float ventX=bx+bw*(0.12+0.64*r1);",
"    float ventTop=capTop+(0.004+0.016*r3)*step(0.42,r2);",
"    float ventMask=smoothstep(ventX-aa,ventX+aa,fx)*(1.0-smoothstep(ventX+ventW-aa,ventX+ventW+aa,fx))*step(capTop-aa,uv.y)*(1.0-smoothstep(ventTop-aa,ventTop+aa,uv.y));",
"    float bodyMask=max(max(max(baseMask,capMask),ventMask),sideMask)*present*(1.0-sunSkip);",
"    if(bodyMask>0.01){",
"      float onSide=step(bx+bw,fx);",
"      float frontU=clamp((fx-bx)/max(bw,0.001),0.0,1.0);",
"      float sideU=clamp((fx-(bx+bw))/max(sideW,0.001),0.0,1.0);",
"      float u=mix(frontU,sideU,onSide);",
"      float side=smoothstep(0.70,0.97,u);",
"      vec3 base=mix(vec3(0.0074,0.0066,0.0092),vec3(0.0096,0.0078,0.0106),nearness);",
"      base+=vec3(0.0094,0.0052,0.0104)*(1.0-nearness)*0.54;",
"      base=mix(base,base*vec3(1.22,1.02,1.15),side*0.62);",
"      vec3 sideBase=mix(vec3(0.0070,0.0038,0.0110),vec3(0.0060,0.0042,0.0104),nearness);",
"      sideBase*=0.48+0.52*sideU;",
"      sideBase=mix(sideBase,sideBase*vec3(1.24,0.94,1.14),0.52);",
"      base=mix(base,sideBase,onSide);",
"      float rib=0.56+0.44*step(0.36,fract(u*(5.0+nearness*5.0)+0.18));",
"      float floorBand=0.76+0.24*step(0.34,fract((roof-uv.y)/0.0085));",
"      float sideFloor=0.88+0.12*step(0.28,fract((sideRoof-uv.y)/0.0090));",
"      float topShadow=0.50+0.50*smoothstep(0.0,0.065,roof-uv.y);",
"      float cornerRib=1.0-smoothstep(0.0,0.0021,abs(u-(onSide>0.5?0.04:0.96)));",
"      base*=rib*floorBand*topShadow*mix(1.0,sideFloor,onSide);",
"      vec3 localEm=vec3(0.0);",
"      float baseCanopy=1.0-smoothstep(0.0,0.0024,abs(uv.y-(uHorizon+0.010+0.008*r1)));",
"      localEm+=mix(vec3(1.0,0.32,0.56),vec3(1.0,0.301,0.562),step(0.86,r3))*baseCanopy*(0.10+0.12*nearness);",
/* Windows are a near/mid detail. Keeping the far band blank makes haze read as distance. */
"      if(i>0){",
"        vec2 wc=floor(vec2(u*9.0,(roof-uv.y)/0.0072));",
"        vec2 wf=fract(vec2(u*9.0,(roof-uv.y)/0.0072));",
"        float glass=step(0.27,wf.x)*step(wf.x,0.73)*step(0.27,wf.y)*step(wf.y,0.69);",
"        float lit=smoothstep(0.80,0.93,hash21(wc+cell*37.0+fi*13.0));",
"        float pulse=0.64+0.36*sin(t*(0.30+0.45*hash11(wc.y+cell))+hash11(wc.x+fi)*6.0);",
"        float wrk=hash11(cell*11.0+fi*4.0);",
"        vec3 wcCol=mix(vec3(1.0,0.308,0.574),vec3(1.0,0.30,0.55),step(0.60,wrk)*step(wrk,0.86));",
"        wcCol=mix(wcCol,vec3(1.0,0.62,0.28),step(0.86,wrk));",
"        wcCol=mix(wcCol,vec3(0.88,0.56,0.38),step(0.94,hash21(wc+cell*7.0))*r2);",
"        localEm+=wcCol*glass*lit*pulse*(0.16+0.13*nearness)*(1.0-side*0.48);",
"      }else{",
"        float farGrid=step(0.48,fract(u*7.0))*step(fract((roof-uv.y)/0.0075),0.24);",
"        float farLit=step(0.94,hash21(floor(vec2(u*7.0,(roof-uv.y)/0.0075))+cell*17.0));",
"        localEm+=vec3(0.42,0.12,0.28)*farGrid*farLit*0.032;",
"      }",
/* Sparse signage and structural neon create scale without turning every tower into a light wall. */
"      float strip=1.0-smoothstep(0.0,0.0012,abs(u-0.88));",
"      float stripOn=step(0.76,hash11(cell*3.7+fi*8.0));",
"      localEm+=mix(vec3(1.0,0.32,0.56),vec3(1.0,0.278,0.526),step(0.76,r3))*strip*stripOn*(0.20+0.16*nearness);",
"      float strip2=1.0-smoothstep(0.0,0.0010,abs(u-(0.08+0.14*r2)));",
"      localEm+=vec3(1.0,0.30,0.55)*strip2*step(0.90,r1)*nearness*0.28;",
"      float facadeRib=1.0-smoothstep(0.0,0.0009,abs(fract(u*(8.0+nearness*5.0)+0.18)-0.5));",
"      localEm+=mix(vec3(1.0,0.278,0.526),vec3(1.0,0.32,0.54),r2)*facadeRib*(1.0-onSide)*(0.003+0.008*nearness);",
"      float frontEdge=(1.0-smoothstep(0.0,0.0013,abs(fx-bx)))*(1.0-onSide);",
"      localEm+=vec3(1.0,0.30,0.55)*frontEdge*(0.06+0.12*nearness);",
"      localEm+=vec3(1.0,0.301,0.562)*cornerRib*(1.0-onSide)*(0.05+0.16*nearness);",
"      float backEdge=1.0-smoothstep(0.0,0.0012,abs(fx-(bx+bw+sideW)));",
"      localEm+=vec3(1.0,0.30,0.55)*backEdge*onSide*(0.08+0.11*nearness);",
"      float roofEdge=(1.0-smoothstep(0.0,0.0015,abs(uv.y-capTop)))*step(bx,fx)*step(fx,bx+bw);",
"      localEm+=mix(vec3(1.0,0.312,0.580),vec3(1.0,0.32,0.56),r4)*roofEdge*(0.10+0.13*nearness);",
"      float signOn=step(0.62,r4)*nearness*(1.0-onSide);",
"      float signHalfW=0.22+0.08*r2;",
"      float signY=abs(uv.y-(uHorizon+hgt*(0.28+0.30*r1)));",
"      float signX=abs(u-(0.26+0.18*r3));",
"      float sign=step(signX,signHalfW)*step(signY,0.011)*signOn;",
"      float signBar=step(abs(signY),0.0014)*step(signX,signHalfW*0.92)*signOn;",
"      localEm+=vec3(1.0,0.30,0.56)*sign*(0.10+0.08*(0.5+0.5*sin(t*1.7+cell)));",
"      localEm+=mix(vec3(1.0,0.30,0.56),vec3(1.0,0.282,0.532),r1)*signBar*0.32;",
"      vec3 shaded=base+localEm;",
"      float baseSoft=0.56+0.44*smoothstep(0.0,0.027,uv.y-uHorizon);",
"      float bodyAlpha=bodyMask*baseSoft;",
"      col=mix(col,shaded,bodyAlpha);",
"      has=max(has,bodyAlpha);",
"      float bcx=(cell+bx+bw*0.5)/dens;",
"      float mastH=(cell*0.0)+0.012+0.022*r2;",
"      float mast=step(0.82,r2)*(1.0-smoothstep(0.00035,0.00075,abs(uv.x-bcx)))",
"                *step(capTop-0.001,uv.y)*step(uv.y,capTop+mastH);",
"      airLights+=vec3(0.38,0.26,0.27)*mast*(0.45+0.25*nearness);",
"      float beacon=1.0-smoothstep(0.0,0.0016,length((uv-vec2(bcx,capTop+mastH))*vec2(1.0,0.38)));",
"      airLights+=vec3(1.0,0.40,0.10)*beacon*step(0.82,r2)*(0.18+0.82*step(0.52,sin(t*2.2+cell*0.7)));",
"    }",
"  }",
"  return vec4(col+airLights,max(has,0.0));",

/* Sparse elevated transit decks add a second architectural direction without
   filling the skyline with more towers. */
"vec4 cityBridge(vec2 uv,float t){",
"  float mask=0.0;",
"  vec3 em=vec3(0.0);",
"  for(int i=0;i<2;i++){",
"    float fi=float(i);",
"    float start=i==0?0.19:0.76;",
"    float finish=i==0?0.46:0.965;",
"    float y=uHorizon+0.082+fi*0.042+sin(uv.x*12.0+fi*3.0)*0.0013;",
"    float span=smoothstep(start,start+0.012,uv.x)*(1.0-smoothstep(finish-0.012,finish,uv.x));",
"    float deck=1.0-smoothstep(0.0,0.0016,abs(uv.y-y));",
"    float underside=1.0-smoothstep(0.0,0.0042,abs(uv.y-y+0.0048));",
"    float pylonPhase=abs(fract((uv.x-start)*8.0)-0.5);",
"    float pylon=(1.0-smoothstep(0.012,0.040,pylonPhase))*step(y-0.042,uv.y)*step(uv.y,y)*span;",
"    mask=max(mask,span*(deck+underside*0.32)+pylon*0.76);",
"    float lampPhase=fract((uv.x-start)*21.0);",
"    float lamps=(1.0-smoothstep(0.06,0.19,abs(lampPhase-0.5)))*exp(-abs(uv.y-y)/0.0023);",
"    em+=mix(vec3(1.0,0.30,0.55),vec3(1.0,0.285,0.538),fi)*lamps*span*0.035;",
"    float rail=(1.0-smoothstep(0.0,0.0011,abs(uv.y-y-0.0017)))*span;",
"    em+=mix(vec3(1.0,0.32,0.58),vec3(1.0,0.289,0.544),fi)*rail*0.055;",
"    em+=vec3(0.10,0.24,0.40)*pylon*0.028;",
"    float trainX=mix(start,finish,fract(t*0.014+fi*0.53+0.11));",
"    float train=exp(-pow((uv.x-trainX)/0.024,2.0))*exp(-abs(uv.y-y+0.002)/0.0018)*span;",
"    em+=vec3(1.0,0.30,0.55)*train*0.075;",
"  }",
"  return vec4(vec3(0.0008,0.0011,0.0024)+em,mask);",
"}",
/* ---- sand : albedo only, lit later ---- */
"vec3 sandAt(vec2 uv,float px,float wet){",
"  float d=uShore-uv.y;",
"  float depth=clamp(d/0.48,0.0,1.0);",
"  vec3 dry=mix(vec3(0.228,0.220,0.224),vec3(0.114,0.102,0.114),smoothstep(0.0,0.50,d));",
"  vec3 wetc=mix(vec3(0.060,0.053,0.060),vec3(0.019,0.015,0.021),smoothstep(0.0,0.50,d));",
"  vec3 c=mix(dry,wetc,wet);",
"  vec2 sg=uv*vec2(uRes.x/uRes.y,1.0)*(34.0+depth*92.0);",
"  float n=fbm3(sg);",
"  float dune=fbm3(sg*0.19+vec2(7.3,2.1));",
"  c+=(n-0.5)*(0.032+depth*0.030);",
"  c*=0.78+0.32*dune;",
"  c+=(hash21(floor(uv*uRes*0.82))-0.5)*0.014;",
/* wind ripples : the same wave rhythm, in perspective */
"  float persp=1.0/(0.30+d*3.4);",
"  float rip=sin(uv.y*persp*120.0+waveShape(uv.x*2.0,uv.y*40.0)*2.2+fbm2(uv*vec2(4.0,8.0))*9.0);",
"  float rip2=sin(uv.y*persp*61.0-uv.x*17.0+fbm2(uv*vec2(9.0,5.0))*7.0);",
"  float slant=sin((uv.x*2.7+uv.y*7.8)*persp*86.0+fbm2(uv*vec2(6.0,11.0))*5.0);",
"  float ridge=pow(0.5+0.5*slant,9.0);",
"  float trough=pow(0.5-0.5*slant,6.0);",
"  float sandFine=fbm2(vec2(uv.x*(680.0+depth*520.0),uv.y*330.0)+vec2(2.4,uTime*0.012));",
"  c*=1.0-0.13*trough*depth;",
"  c+=vec3(0.86,0.78,0.66)*ridge*0.026*(1.0-wet*0.62);",
"  c+=(sandFine-0.5)*0.013*(1.0-wet*0.55);",
"  c+=vec3(0.80,0.70,0.58)*smoothstep(0.58,0.99,rip)*0.024*(1.0-wet*0.62);",
"  c*=1.0-0.055*(1.0-smoothstep(-0.65,0.35,rip))*depth;",
"  c+=vec3(1.0,0.274,0.520)*smoothstep(0.82,1.0,rip2)*0.052*wet;",
"  c+=vec3(1.0,0.58,0.22)*smoothstep(0.92,1.0,rip)*0.065*wet;",
/* mica : a few grains catching the light */
"  float spk=step(0.9984,hash21(floor(uv*uRes*0.9)));",
"  c+=vec3(1.0,0.70,0.42)*spk*(0.22+0.18*(1.0-wet));",
"  float shell=step(0.9975,hash21(floor(sg*1.6)+19.0));",
"  c+=mix(vec3(0.18,0.10,0.06),vec3(0.30,0.40,0.46),step(0.5,hash21(floor(sg*1.6))))*shell*0.45;",
"  return c; }",

/* ---- the hand written groove in the sand ---- */
"float sandH(vec2 uv){ return -inkAt(uv)*(1.0-eroAt(uv)); }",
"vec3 writeInk(vec3 sand,vec2 uv,vec2 L,out float bloom){",
"  float g=inkAt(uv)*(1.0-eroAt(uv));",
"  if(g<0.001){ bloom=0.0; return sand; }",
"  float litRidge=inkAt(uv+L*1.25)*(1.0-eroAt(uv+L*1.25));",
"  float backRidge=inkAt(uv-L*1.55)*(1.0-eroAt(uv-L*1.55));",
"  float sideRidge=inkAt(uv+vec2(L.y*1.05,-L.x*0.62))*(1.0-eroAt(uv+vec2(L.y*1.05,-L.x*0.62)));",
"  float castA=inkAt(uv-L*3.6)*(1.0-eroAt(uv-L*3.6));",
"  float castB=inkAt(uv-vec2(0.0044,-0.0018))*(1.0-eroAt(uv-vec2(0.0044,-0.0018)));",
"  float skirt=(inkAt(uv+L*4.2)+inkAt(uv-L*4.2)+inkAt(uv+vec2(L.x*5.2,0.0))+inkAt(uv-vec2(L.x*5.2,0.0)))*0.25;",
"  float grain=fbm2(uv*vec2(360.0,245.0)+vec2(0.0,uTime*0.020));",
"  float fiber=fbm2(uv*vec2(760.0,520.0)+vec2(3.7,uTime*0.045));",
"  float fleck=fbm2(uv*vec2(1180.0,820.0)+vec2(9.1,-uTime*0.032));",
"  float grooveVar=fbm2(uv*vec2(470.0,315.0)+vec2(7.0,uTime*0.028));",
"  float pressure=0.76+0.24*fbm2(uv*vec2(125.0,92.0)+vec2(1.4,-uTime*0.018));",
"  float ink=smoothstep(0.030,0.60,g*(0.91+0.09*grooveVar));",
"  float broken=ink*(0.93+0.07*smoothstep(0.12,0.86,fiber));",
"  float ridge=max(litRidge-g,0.0)*smoothstep(0.30,0.92,1.0-fiber);",
"  float cavity=max(g-(litRidge+backRidge)*0.5,0.0);",
"  float shadeOnSand=clamp((castA*0.65+castB*0.35)-broken*0.18,0.0,1.0);",
"  float lipCool=max(sideRidge-g,0.0)*(0.40+0.60*fiber);",
"  float reliefEdge=clamp((g-max(litRidge,backRidge))*4.2,0.0,1.0);",
"  bloom=skirt*(1.0-eroAt(uv))*(0.085+0.24*uCharge);",
/* A groove is a displaced surface: broad sun-side lip, recessed core, and a
   narrow cast shadow. This remains readable without turning the mark neon. */
"  sand*=1.0-(0.52+0.16*grooveVar)*broken*pressure;",
"  sand*=1.0-0.032*broken*smoothstep(0.54,0.86,fiber);",
"  sand*=1.0-0.045*broken*smoothstep(0.67,0.88,fleck);",
"  sand*=1.0-0.28*shadeOnSand*pressure;",
"  sand*=1.0-0.14*cavity*pressure;",
"  sand+=vec3(1.0,0.86,0.60)*(0.38+0.42*grooveVar)*ridge*pressure;",
"  sand+=vec3(1.0,0.278,0.526)*(0.12+0.22*fiber)*lipCool*pressure;",
"  sand+=vec3(1.0,0.86,0.60)*reliefEdge*(0.24+0.22*fiber)*pressure;",
"  sand+=vec3(0.028,0.044,0.066)*broken*(0.55+0.45*fiber)*pressure;",
"  sand+=vec3(1.0,0.282,0.532)*cavity*0.090*(1.0-g);",
"  sand+=vec3(1.0,0.68,0.36)*broken*smoothstep(0.76,0.94,fleck)*0.022*pressure;",
"  sand+=vec3(1.0,0.32,0.58)*bloom*0.215*uCharge;",
"  return sand; }",

/* ---- lighting helpers ---- */
"vec3 sandLight(vec3 albedo,float lit,float wet){",
"  vec3 amb=vec3(0.212,0.196,0.222)*(0.88+wet*0.40);",
"  vec3 skyBounce=vec3(0.074,0.050,0.068)*(1.0-wet*0.40);",
"  vec3 dir=vec3(0.76,0.51,0.24)*lit;",
"  vec3 cool=vec3(0.30,0.21,0.30)*lit*0.26;",
"  return albedo*(amb+skyBounce+dir+cool); }",

/* ---- the hologram : a column of light, a helix of pixels inside it ---- */
"vec3 holoProj(vec2 uv,float t,float id){",
"  vec3 c=vec3(0.0);",
"  float cx=0.435+id*0.345;",
"  float base=uHorizon-0.018, top=uHorizon+0.075+id*0.045;",
"  float h=clamp((uv.y-base)/(top-base),0.0,1.0);",
"  float wid=0.0080+id*0.0020;",
"  float dx=abs(uv.x-cx);",
"  float inY=smoothstep(base-0.016,base+0.020,uv.y)*(1.0-smoothstep(top-0.020,top+0.040,uv.y));",
"  float panel=1.0-smoothstep(wid*0.80,wid,dx);",
"  float flick=0.88+0.12*sin(t*21.0+id*1.7);",
"  float amp=1.0-id*0.50;",
"  float scan=pow(0.5+0.5*sin(h*34.0-t*1.45),8.0);",
"  float noise=0.68+0.32*fbm2(vec2(h*18.0-t*0.10,id*7.0+2.0));",
/* A translucent volumetric display, not a solid searchlight. */
"  c+=vec3(1.0,0.304,0.568)*panel*inY*(0.018+0.040*scan)*noise*flick*amp;",
"  float haze=exp(-pow(dx/(wid*4.8),2.0));",
"  c+=vec3(1.0,0.308,0.574)*haze*inY*(0.008+0.018*h)*amp;",
"  float edge=1.0-smoothstep(0.0,0.0012,abs(dx-wid*0.80));",
"  c+=vec3(0.46,0.38,1.0)*edge*inY*(0.055+0.035*scan)*amp;",
"  float foot=exp(-abs(uv.y-base)/0.018)*exp(-pow(dx/(wid*2.2),2.0));",
"  c+=vec3(1.0,0.312,0.580)*foot*0.028*amp;",
"  return c;",
"}",,

    q([ult,top],[usrt,top],[usrt,top+0.0035],[ult,top+0.0035],roof,s.seed+1.5,2,2);
    hbar(ul,ufr,waist,[0.20,0.16,0.24],s.seed+2.0,2.0);
    var crownW=upperW*(0.38+0.08*r),crownH=0.009+0.008*r;
    section(s.cx-crownW,s.cx+crownW,top,top+crownH,upperW*0.15,0.002,
      [0.050,0.050,0.082],[0.078,0.048,0.090],[0.115,0.080,0.130],s.seed+3.0);
    var accent=i%2?cyan:pink;
    vbar(ul,waist+0.004,top,accent,s.seed+20.0,1.0);
    if(i===0||i===2){
      var adW=s.hw*0.68,adH=0.036+0.010*r;
      var adX=s.cx+s.hw*0.08,adY=HORIZON+s.h*(0.46+0.05*r);
      q([adX,adY],[adX+adW,adY],[adX+adW,adY+adH],[adX,adY+adH],
        [accent[0]*0.10+0.025,accent[1]*0.10+0.018,accent[2]*0.10+0.040],s.seed+8.0,2,3);
      hbar(adX,adX+adW,adY,accent,s.seed+9.0,1.0);
      hbar(adX,adX+adW,adY+adH,accent,s.seed+10.0,1.0);
      hbar(adX+adW*0.14,adX+adW*0.72,adY+adH*0.52,
        [accent[0]*0.72,accent[1]*0.72,accent[2]*0.72],s.seed+10.5,1.0);
      var mastX=s.cx+s.hw*0.12,mastH=0.026+0.018*r;
      vbar(mastX,top+crownH,top+crownH+mastH,[0.34,0.34,0.46],s.seed+25.0,2.0);
      q([mastX-px*1.5,top+crownH+mastH-py*1.5],
        [mastX+px*1.5,top+crownH+mastH-py*1.5],
        [mastX+px*1.5,top+crownH+mastH+py*1.5],
        [mastX-px*1.5,top+crownH+mastH+py*1.5],pink,s.seed+26.0,1.0,0.8);
    }
  }
  BUILD_COUNT=data.length/10;
  gl.bindBuffer(gl.ARRAY_BUFFER,skylineBuf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(data),gl.STATIC_DRAW);
}

var ERO_SIZE=384;
var texInk,texScene,texBloomA,texBloomB,sceneFbo,bloomFboA,bloomFboB,BLOOMW=2,BLOOMH=2;
var eroTex=[],eroFbo=[],eroCur=0;
var inkCv=document.getElementById('ink'),inkCx=inkCv.getContext('2d');
var IBOX={x:0,y:0,w:0,h:0},SS=1;

function initGL(){
  progScene=program(VS_SRC,SCENE_SRC);
  progEro=program(VS_SRC,ERO_SRC);
  progPost=program(VS_SRC,POST_SRC);
  progBright=program(VS_SRC,BRIGHT_SRC);

  UP=uniforms(progPost,['uTex','uBloom','uRes','uTime','uBloomK','uHorizon','uShore']);
  UB=uniforms(progBright,['uTex','uThresh']);

/* ==================================================================
   3. LAYOUT
   ================================================================== */
var W=0,H=0,DPR=1;
var RENDER_SCALE=1.35,RENDER_CAP=1.5,MAX_PIX=3600000;
var ADAPTIVE_REDUCED=false,PERF_FRAMES=0,PERF_TOTAL=0;
var HORIZON=0.665, SHORE=0.462, MAXY=0.028;   // GL space, y up
var SUN=[0.665,0.706], SUN_R=0.052;

/* The HUD is pinned to the world, not to the window : the datum line, the
   acquisition reticle and the inscription frame all track the geometry,
   so the overlay reads as a projected instrument and not as a title card. */
function placeHUD(){
  var ui=document.getElementById('ui');
  if(!ui||W<=0||H<=0) return;
  var hz=ui.querySelector('.ui-horizon');
  if(hz) hz.style.top=((1-HORIZON)*100).toFixed(3)+'%';
  var ret=ui.querySelector('.ui-reticle');
  if(ret){
    ret.style.left=(SUN[0]*100).toFixed(3)+'%';
    ret.style.top=((1-SUN[1])*100).toFixed(3)+'%';
    ret.style.setProperty('--rr',Math.round(SUN_R*H*2.30)+'px');
  }
  var az=ui.querySelector('.ui-hz-sun');
  if(az){
    az.style.left=(SUN[0]*100).toFixed(3)+'%';
    az.setAttribute('data-az','AZ '+String(Math.round(SUN[0]*360)).padStart(3,'0'));
  }
}

function layout(){
  var rc=document.getElementById('stage').getBoundingClientRect();
  W=Math.max(320,Math.round(rc.width));
  H=Math.max(320,Math.round(rc.height));
  var nativeDpr=Math.min(window.devicePixelRatio||1,2);
  DPR=Math.min(RENDER_CAP,Math.max(RENDER_SCALE,nativeDpr));
  SUN_R=W/H<0.72?0.045:0.052;
  /* 1.35-1.5x supersampling; the final CSS downscale supplies SSAA. */
  if(W*H*DPR*DPR>MAX_PIX) DPR=Math.max(1,Math.sqrt(MAX_PIX/(W*H)));
  glc.width=Math.round(W*DPR); glc.height=Math.round(H*DPR);
  gl.viewport(0,0,glc.width,glc.height);

  /* a human-scale inscription zone, held inside the near beach */
  var portrait=W<700;
  /* The field of writing lies on the open sand directly under the tide line
     and runs almost to the bottom edge : the water has a long way to travel
     before it can reach the words. */
  IBOX.w=W*(portrait?0.86:0.60);
  IBOX.h=H*(portrait?0.38:0.40);
  IBOX.x=(W-IBOX.w)*0.5;
  IBOX.y=H*(1.0-SHORE)+H*0.018;

  SS=portrait?1.15:1.35;
  /* Changing the canvas size erases it, so the inscription is copied across
     before the new size is set. A resize must never destroy the words. */
  var keepInk=null;
  if(strokes.length&&inkCv.width>1&&inkCv.height>1){
    keepInk=document.createElement('canvas');
    keepInk.width=inkCv.width; keepInk.height=inkCv.height;
    keepInk.getContext('2d').drawImage(inkCv,0,0);
  }
  inkCv.width=Math.round(IBOX.w*SS); inkCv.height=Math.round(IBOX.h*SS);
  if(keepInk){
    inkCx.clearRect(0,0,inkCv.width,inkCv.height);
    inkCx.drawImage(keepInk,0,0,inkCv.width,inkCv.height);
  }

  texScene=newTex(glc.width,glc.height);
  if(!sceneFbo) sceneFbo=gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER,sceneFbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,texScene,0);

  var bw=Math.max(2,Math.round(glc.width/4)), bh=Math.max(2,Math.round(glc.height/4));
  BLOOMW=bw; BLOOMH=bh;
  texBloomA=newTex(bw,bh);
  texBloomB=newTex(bw,bh);
  bloomFboA=newFBO(texBloomA);
  bloomFboB=newFBO(texBloomB);

  gl.bindFramebuffer(gl.FRAMEBUFFER,null);

  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
  gl.bindTexture(gl.TEXTURE_2D,texInk); uploadCanvas(texInk,inkCv);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
  inkDirty=false;
  buildSkyline();
  placeHUD();
}
function uploadCanvas(tex,cv){
  gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,cv);
}
function clearEro(){
  for(var i=0;i<2;i++){
    gl.bindFramebuffer(gl.FRAMEBUFFER,eroFbo[i]);
    gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT);
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  eroCur=0;
}

/* ==================================================================
   4. WRITING IN THE SAND
   ================================================================== */
var strokes=[],cur=null,drawing=false,inkDirty=false;
var charge=0,flash=0,mouse=[-9,-9],mouseOn=0;
var idleT=0,hintV=1;

function inkPos(ev){
  var rc=glc.getBoundingClientRect();
  var x=(ev.clientX-rc.left)/rc.width*W;
  var y=(ev.clientY-rc.top)/rc.height*H;
  return [ (x-IBOX.x)/IBOX.w, (y-IBOX.y)/IBOX.h ];
}
function inside(p){ return p[0]>=0&&p[0]<=1&&p[1]>=0&&p[1]<=1; }
function clampInkPoint(p){
  return [Math.max(0,Math.min(1,p[0])),Math.max(0,Math.min(1,p[1]))];
}
function commitInkPoint(p,forceTail){
  if(!cur){ cur=[p]; strokes.push(cur); }
  var last=cur[cur.length-1];
  var dpx=Math.max(
    Math.abs(last[0]-p[0])*inkCv.width,
    Math.abs(last[1]-p[1])*inkCv.height
  );
  if(dpx>=2){
    cur.push(p);
    inkStamp(last,p);
  }else if(forceTail){
    /* Chinese characters commonly finish with a short dot or flick in the
       lower-right. Keep that final pressure even when pointerup moves <2px. */
    inkStamp(p,[p[0]+0.00035,p[1]-0.00015]);
  }
}

function inkBegin(ev){
  if(STATE!=='IDLE') return;
  var p=inkPos(ev);
  if(!inside(p)) return;
  drawing=true; cur=[p]; strokes.push(cur); idleT=0; inkDirty=true; hintV=0;
  inkStamp(p,[p[0]+0.0008,p[1]-0.0002]);
  if(glc.setPointerCapture&&ev.pointerId!=null) glc.setPointerCapture(ev.pointerId);
  ev.preventDefault();
}
function inkMove(ev){
  var p=inkPos(ev);
  mouseOn=1; mouse=[(IBOX.x+p[0]*IBOX.w)/W,1-(IBOX.y+p[1]*IBOX.h)/H];
  if(!drawing) return;
  var points=ev.getCoalescedEvents?ev.getCoalescedEvents():null;
  if(!points||!points.length) points=[ev];
  for(var i=0;i<points.length;i++){
    var q=inkPos(points[i]);
    if(inside(q)) commitInkPoint(q,false);
  }
  inkDirty=true;
}
function inkEnd(ev){
  if(!drawing) return;
  /* Keep the pointer-up endpoint. If a fast gesture leaves the active box,
     clamp that endpoint to its edge so a lower-right flick is never omitted. */
  var end=null;
  if(ev&&ev.type!=='pointercancel'&&ev.clientX!=null){
    end=clampInkPoint(inkPos(ev));
  }else if(cur&&cur.length){
    end=cur[cur.length-1].slice();
  }
  if(end) commitInkPoint(end,true);
  drawing=false; cur=null; inkDirty=true; idleT=0;
}
function inkStamp(a,b){
  var g=inkCx,w=inkCv.width,h=inkCv.height;
  var ax=a[0]*w,ay=a[1]*h,bx=b[0]*w,by=b[1]*h;
  var dx=bx-ax,dy=by-ay,len=Math.max(0.001,Math.hypot(dx,dy));
  var ux=dx/len,uy=dy/len,nx=-uy,ny=ux;
  var ripple=0.5+0.5*Math.sin(ax*0.019+ay*0.031+bx*0.013-by*0.021);
  var pressure=0.76+0.18*ripple+0.06*Math.sin((ax+by)*0.0047+1.3);
  var drift=Math.sin((ax-bx)*0.018+(ay+by)*0.011);
  var wgt=Math.max(4.2,IBOX.h*(0.0215+0.0075*pressure));
  var outer=0.12+0.08*(1.0-pressure);
  var mid=0.44+0.15*pressure;
  var core=0.90+0.07*pressure;
  g.lineCap='round'; g.lineJoin='round';
  /* A fine, pressure-sensitive groove with slightly ragged capillaries. */
  g.lineWidth=wgt*SS*(1.00+0.10*pressure); g.strokeStyle='rgba(255,255,255,'+outer.toFixed(3)+')';
  g.beginPath(); g.moveTo(ax,ay); g.lineTo(bx,by); g.stroke();
  g.lineWidth=wgt*SS*(0.61+0.13*pressure); g.strokeStyle='rgba(255,255,255,'+mid.toFixed(3)+')';
  g.beginPath(); g.moveTo(ax,ay); g.lineTo(bx,by); g.stroke();
  g.lineWidth=wgt*SS*(0.20+0.07*pressure); g.strokeStyle='rgba(255,255,255,'+core.toFixed(3)+')';
  g.beginPath(); g.moveTo(ax,ay); g.lineTo(bx,by); g.stroke();
  for(var k=0;k<2;k++){
    var side=(k?1:-1)*wgt*SS*(0.17+0.05*pressure+0.03*Math.abs(drift));
    var skip=(k?0.50:0.72)+0.16*Math.sin((ax+bx)*0.067+(k?1.7:0.2));
    g.lineWidth=Math.max(1,wgt*SS*(0.045+0.025*Math.abs(drift)));
    g.strokeStyle='rgba(255,255,255,'+(0.11+0.20*skip).toFixed(3)+')';
    g.beginPath();
    g.moveTo(ax+nx*side+ux*len*0.08,ay+ny*side+uy*len*0.08);
    g.lineTo(ax+nx*side+ux*len*0.88,ay+ny*side+uy*len*0.88);
    g.stroke();
  }
}
function inkAmount(){
  var s=0;
  for(var i=0;i<strokes.length;i++){
    var st=strokes[i];
    for(var k=1;k<st.length;k++) s+=Math.hypot(st[k][0]-st[k-1][0],st[k][1]-st[k-1][1]);
  }
  return s;
}
function clearInk(){
  strokes=[]; cur=null; drawing=false;
  inkCx.clearRect(0,0,inkCv.width,inkCv.height);
  inkDirty=true; clearEro(); charge=0;
  recog={ok:false,s:0}; lastSig=''; idleT=0;
  STATE='IDLE';
}

var TARGETS=['祁','煜'];
/* the comparison grid : a character seen through 24 cells is a blob, seen
   through 64 cells it is a shape.  The distance scale must follow it, or a
   finer grid would only make every score smaller. */
var RG=64, TPL=null;
var CHAMFER_CAP=8.0, CHAMFER_SCALE=6.0;
/* look-alike negative samples: tighten the decision, never a target */
var DECOYS=['\u7948','\u7950','\u7953','\u7957','\u70e7','\u711f','\u709c','\u708a','\u70ed','\u711c'];

function maskToGrid(mask,w,h,bx0,by0,bw,bh){
  var g=new Float32Array(RG*RG);
  var kx=RG/bw, ky=RG/bh;
  for(var y=0;y<RG;y++){
    var ya=by0+y/ky, yb=by0+(y+1)/ky;
    for(var x=0;x<RG;x++){
      var xa=bx0+x/kx, xb=bx0+(x+1)/kx;
      var s=0,c=0,xx,yy,ix,iy;
      for(yy=ya|0; yy<=yb; yy++){ iy=yy; if(iy<0||iy>=h) continue;
        for(xx=xa|0; xx<=xb; xx++){ ix=xx; if(ix<0||ix>=w) continue; s+=mask[iy*w+ix]; c++; } }
      g[y*RG+x]=c>0?s/c:0;
    }
  }
  return blurGrid(g,RG,1);
}
function blurGrid(a,G,r){
  var t=new Float32Array(G*G),i,x,y;
  for(y=0;y<G;y++)for(x=0;x<G;x++){
    var s=0,c=0;
    for(var k=-r;k<=r;k++){var xx=x+k;if(xx<0||xx>=G)continue;s+=a[y*G+xx];c++;}
    t[y*G+x]=s/c;
  }
  var o=new Float32Array(G*G);
  for(y=0;y<G;y++)for(x=0;x<G;x++){
    var s2=0,c2=0;
    for(k=-r;k<=r;k++){var yy=y+k;if(yy<0||yy>=G)continue;s2+=t[yy*G+x];c2++;}
    o[y*G+x]=s2/c2;
  }

var TPLV={},SHEET=null;
function buildTPL(){
  var im=new Image();
  im.onload=function(){ buildTPLFrom(im); };
  im.onerror=function(){ buildTPLFrom(null); };
  im.src=TPL_SHEET;
}
function buildTPLFrom(im){
  TPL={}; TPLV={}; SHEET=im;
  var all=TARGETS.concat(DECOYS);
  /* the sheet carries one row per typeface : a hand is not one alphabet,
     so every character is known in several hands */
  var rows=im?Math.max(1,Math.round(im.height/64)):1;
  for(var i=0;i<all.length;i++){
    var ch=all[i],vs=[];
    for(var r=0;r<rows;r++){
      var g=im?sheetGrid(im,i,r):fontGrid(ch);
      if(!g) continue;
      if(r===0) TPL[ch]=g;
      vs.push({g:g,d:distT(g)});
      for(var v=0;v<JIT.length;v++){
        var jg=jitterGrid(g,JIT[v][0],JIT[v][1],JIT[v][2],0,0);
        vs.push({g:jg,d:distT(jg)});
      }
    }
    if(!vs.length) continue;
    TPL[ch]=vs[0].g;
    TPLV[ch]=vs;
  }
  if(PENDING_DEMO) writeDemo();
}
/* a region of a mask, resampled to one canonical size, thinned, gridded :
   two characters are only comparable at the same scale */
function gridOfRegion(m,w,h,bx,by,bw,bh){
  var k=64/Math.max(bw,bh);
  var nw=Math.max(6,Math.round(bw*k)), nh=Math.max(6,Math.round(bh*k));
  var src=document.createElement('canvas');src.width=bw;src.height=bh;
  var sg=src.getContext('2d');
  var id=sg.createImageData(bw,bh),d=id.data;
  for(var y=0;y<bh;y++)for(var x=0;x<bw;x++){
    var sx=bx+x,sy=by+y;
    var v=(sx>=0&&sx<w&&sy>=0&&sy<h)?m[sy*w+sx]:0;
    var o=(y*bw+x)*4;
    d[o]=255;d[o+1]=255;d[o+2]=255;d[o+3]=v>1?255:(v<0?0:(v*255)|0);
  }
  sg.putImageData(id,0,0);
  var cv=document.createElement('canvas');cv.width=nw;cv.height=nh;
  var cg=cv.getContext('2d');
  cg.fillStyle='#000';cg.fillRect(0,0,nw,nh);
  cg.imageSmoothingEnabled=true;
  cg.drawImage(src,0,0,nw,nh);
  var im=cg.getImageData(0,0,nw,nh).data,mm=new Float32Array(nw*nh);
  for(var i=0;i<mm.length;i++) mm[i]=im[i*4]/255;

function sheetGrid(im,idx,row){
  var C=64;

  var g=c.getContext('2d');

  var im2=g.getImageData(0,0,C,C).data,m=new Float32Array(C*C);
  for(var i=0;i<C*C;i++) m[i]=im2[i*4]/255;

function fontGrid(ch){
  var S=140,c=document.createElement('canvas');c.width=S;c.height=S;

  if(STATE!=='IDLE') return;
  STATE='TIDE'; T=0; flash=1; charge=1; clearEro();
}
function finishTide(){
  clearInk();
  T=0;
}

/* ==================================================================
   6. FRAME
   ================================================================== */
var prevT=performance.now(),tsec=0,wetV=0,wetMark=0,DBG=false,HOLD=false;
var uiStatusEl=document.getElementById('ui-status'),lastUIStatus='';

function uniformsNow(){
  return STATE==='TIDE'?tideP(T):0;
}
function waveAmp(){
  if(STATE==='TIDE') return 0.10+0.90*Math.max(0,tideP(T));
  return 0.10;
}
function updateUI(){
  var label;
  if(STATE==='TIDE') label=T<PH.h1?'TIDE ADVANCING':'TIDE RECEDING';
  else if(drawing) label='CAPTURING GESTURE';
  else if(recog.ok) label='MATCH LOCKED';
  else label='AWAITING INSCRIPTION';
  if(label!==lastUIStatus&&uiStatusEl){
    uiStatusEl.textContent=label;
    lastUIStatus=label;
  }
}
function setSceneU(){
  gl.useProgram(progScene);
  gl.uniform2f(U.uRes,glc.width,glc.height);
  gl.uniform1f(U.uTime,tsec);
  gl.uniform1f(U.uTide,uniformsNow());
  gl.uniform1f(U.uWave,waveAmp());
  gl.uniform1f(U.uCharge,charge);
  gl.uniform1f(U.uFlash,flash);
  gl.uniform1f(U.uWet,wetV);
  gl.uniform1f(U.uHint,hintV);
  gl.uniform1f(U.uMark,wetMark);
  gl.uniform1f(U.uShore,SHORE);
  gl.uniform1f(U.uMax,MAXY);
  gl.uniform1f(U.uHorizon,HORIZON);
  gl.uniform2f(U.uSun,SUN[0],SUN[1]);
  gl.uniform1f(U.uSunR,SUN_R);
  gl.uniform4f(U.uBox,IBOX.x/W,1-(IBOX.y+IBOX.h)/H,IBOX.w/W,IBOX.h/H);
  gl.uniform2f(U.uMouse,mouse[0],mouse[1]);
  gl.uniform1f(U.uMouseOn,mouseOn);
}
function eroStep(dt){
  var dst=1-eroCur;
  gl.bindFramebuffer(gl.FRAMEBUFFER,eroFbo[dst]);
  gl.viewport(0,0,ERO_SIZE,ERO_SIZE);
  gl.useProgram(progEro);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D,eroTex[eroCur]);
  gl.uniform1i(UE.uEro,0);
  gl.uniform1f(UE.uTime,tsec);
  gl.uniform1f(UE.uTide,uniformsNow());
  gl.uniform1f(UE.uWave,waveAmp());
  gl.uniform1f(UE.uShore,SHORE);
  gl.uniform1f(UE.uMax,MAXY);
  gl.uniform1f(UE.uDt,dt);
  gl.uniform4f(UE.uBox,IBOX.x/W,1-(IBOX.y+IBOX.h)/H,IBOX.w/W,IBOX.h/H);
  drawQuad();
  eroCur=dst;
}
function renderSkyline(){
  if(!BUILD_COUNT||!progBuild) return;
  gl.useProgram(progBuild);
  gl.bindBuffer(gl.ARRAY_BUFFER,skylineBuf);
  var stride=10*4;
  gl.enableVertexAttribArray(BA.pos);
  gl.vertexAttribPointer(BA.pos,2,gl.FLOAT,false,stride,0);
  gl.enableVertexAttribArray(BA.local);
  gl.vertexAttribPointer(BA.local,2,gl.FLOAT,false,stride,2*4);
  gl.enableVertexAttribArray(BA.color);
  gl.vertexAttribPointer(BA.color,3,gl.FLOAT,false,stride,4*4);
  gl.enableVertexAttribArray(BA.style);
  gl.vertexAttribPointer(BA.style,3,gl.FLOAT,false,stride,7*4);
  gl.uniform1f(BU.uTime,tsec);
  gl.enable(gl.BLEND);
  gl.blendFuncSeparate(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA,gl.ZERO,gl.ONE_MINUS_SRC_ALPHA);
  gl.drawArrays(gl.TRIANGLES,0,BUILD_COUNT);
  gl.disable(gl.BLEND);
}
function render(dt){
  if(STATE==='TIDE') eroStep(Math.min(dt,0.05));

  /* ---- scene ---- */
  gl.bindFramebuffer(gl.FRAMEBUFFER,sceneFbo);
  gl.viewport(0,0,glc.width,glc.height);
  setSceneU();
  bindTex(0,texInk,U.uInk);
  bindTex(1,eroTex[eroCur],U.uEro);
  drawQuad();
  renderSkyline();

  /* ---- bloom : bright pass, blur h, blur v ---- */
  var bw=BLOOMW,bh=BLOOMH;
  gl.bindFramebuffer(gl.FRAMEBUFFER,bloomFboA);
  gl.viewport(0,0,bw,bh);
  gl.useProgram(progBright);
  bindTex(0,texScene,UB.uTex);
  gl.uniform1f(UB.uThresh,1.45);
  drawQuad();

  gl.bindFramebuffer(gl.FRAMEBUFFER,bloomFboB);
  gl.useProgram(progBlur);
  bindTex(0,texBloomA,UBLUR.uTex);
  gl.uniform2f(UBLUR.uDir,1.4/bw,0);
  drawQuad();

  gl.bindFramebuffer(gl.FRAMEBUFFER,bloomFboA);
  bindTex(0,texBloomB,UBLUR.uTex);
  gl.uniform2f(UBLUR.uDir,0,1.4/bh);
  drawQuad();

  /* ---- post ---- */
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.viewport(0,0,glc.width,glc.height);
  gl.useProgram(progPost);
  bindTex(0,texScene,UP.uTex);
  bindTex(1,texBloomA,UP.uBloom);
  gl.uniform2f(UP.uRes,glc.width,glc.height);
  gl.uniform1f(UP.uTime,tsec);
  gl.uniform1f(UP.uBloomK,0.085);

  gl.uniform1f(UP.uHorizon,HORIZON);
  gl.uniform1f(UP.uShore,SHORE);
  drawQuad();
}

function frame(now){
  var dt=(now-prevT)/1000; prevT=now;
  if(dt>0.1)dt=0.1; if(dt<0)dt=0;
  tsec+=dt;

  if(!DBG&&!ADAPTIVE_REDUCED){
    PERF_FRAMES++; PERF_TOTAL+=dt*1000;
    if(PERF_FRAMES>=90){
      var avgMs=PERF_TOTAL/PERF_FRAMES;
      PERF_FRAMES=0; PERF_TOTAL=0;
      if(avgMs>25){
        RENDER_SCALE=1.0; RENDER_CAP=1.0; ADAPTIVE_REDUCED=true;
        layout();
      }
    }
  }

  if(drawing){ idleT=0; charge=lerp(charge,1,dt*7); }
  else{ idleT+=dt; charge=lerp(charge,0.10,dt*2.4); }
  if(hintV>0&&(drawing||tsec>10)) hintV=Math.max(0,hintV-dt*2.0);

  if(STATE==='IDLE'&&!drawing) runRecognition(false);
  if(!HOLD&&STATE==='IDLE'&&!drawing&&recog.ok&&idleT>0.8) startTide();
  if(STATE==='TIDE'){ T+=dt/TIDE_DUR; if(T>=1) finishTide(); }

  var wt=STATE==='TIDE'
    ? (T<PH.h1?1:Math.max(0,1-(T-PH.h1)/(PH.r1-PH.h1))) : 0;
  wetV=lerp(wetV,wt,1-Math.pow(0.02,dt));

  /* the tide leaves a mark on the sand, and the sand slowly dries */
  var wyNow=lerp(SHORE,MAXY,uniformsNow());
  if(STATE==='TIDE'){ if(wyNow>wetMark) wetMark=wyNow; }
  else wetMark=Math.max(0,wetMark-0.010*dt);

  flash=Math.max(0,flash-dt*1.6);

  if(inkDirty){
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
    uploadCanvas(texInk,inkCv);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
    inkDirty=false;
  }

  updateUI();
  render(dt);
  if(!DBG) requestAnimationFrame(frame);
}
function lerp(a,b,t){ return a+(b-a)*t; }

/* ==================================================================
   7. INPUT
   ================================================================== */
glc.addEventListener('pointerdown',inkBegin);
window.addEventListener('pointermove',inkMove);
window.addEventListener('pointerup',inkEnd);
window.addEventListener('pointercancel',inkEnd);
window.addEventListener('blur',function(){ if(drawing) inkEnd(null); });
glc.addEventListener('pointerleave',function(){mouseOn=0;mouse=[-9,-9];});
glc.addEventListener('contextmenu',function(e){e.preventDefault();});
window.addEventListener('keydown',function(e){
  if(e.code==='Space'){ e.preventDefault(); if(STATE==='IDLE') startTide(); }
  else if(e.code==='KeyC'){ clearInk(); }
});

/* ==================================================================
   8. BOOT
   ================================================================== */
var rzT=null;
var PENDING_DEMO=0;
window.addEventListener('resize',function(){ clearTimeout(rzT); rzT=setTimeout(function(){ layout(); },160); });

function boot(){
  initGL();
  layout();
  buildTPL();
  var qq=new URLSearchParams(location.search);
  HOLD=qq.has('notide');

  var b=document.getElementById('boot');
  var q=new URLSearchParams(location.search);
  if(q.has('freeze')||q.has('demo')||q.has('nointro')){ if(b.parentNode)b.parentNode.removeChild(b); }
  else{ b.className='gone'; setTimeout(function(){ if(b.parentNode)b.parentNode.removeChild(b); },520); }

  if(q.has('demo')||q.has('freeze')){
    /* Wait for the multi-face template sheet before drawing the demo. */
    PENDING_DEMO=1;
  }
  if(!DBG) requestAnimationFrame(frame);
}
function writeDemo(){
  PENDING_DEMO=0;
  strokes=glyphStrokes();
  inkDirty=true; charge=1;
  var q=new URLSearchParams(location.search);
  if(q.has('freeze')){
    DBG=true; STATE='TIDE';
    T=parseFloat(q.get('freeze'))||0.5; charge=1; tsec=4.2;
    wetV=(T<PH.r1)?1.0:Math.max(0,Math.min(1,1-(T-PH.r1)/(1-PH.r1)));
    for(var e=0;e<14;e++) eroStep(0.28);
    prevT=performance.now();
    frame(prevT);
  }
}
try{ boot(); }
catch(err){
  var b=document.getElementById('boot');
  window.__err=String(err&&err.stack||err);
  if(window.console) console.error(window.__err);
  if(b){ b.className=''; b.style.opacity='1'; }
}
</script>
