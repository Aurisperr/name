<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Summon the Sea God</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden;background:#04070b}
  html{touch-action:manipulation}
  #stage{position:fixed;inset:0;overflow:hidden;background:#04070b;isolation:isolate;
      --band:56px}
  #gl{position:absolute;inset:0;width:100%;height:100%;display:block;
      cursor:crosshair;touch-action:none}
  /* the overlay is projected light, not signage : it adds to the picture */
  #scrim{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:.62;
      background:radial-gradient(132% 96% at 50% 44%,transparent 46%,
                 rgba(2,5,9,.24) 80%,rgba(2,5,9,.56) 100%),
                 linear-gradient(180deg,rgba(2,5,9,.52),transparent 15%,
                 transparent 80%,rgba(2,5,9,.54))}
  #ui{position:absolute;inset:0;z-index:4;pointer-events:none;
      mix-blend-mode:screen;
      font-family:"SFMono-Regular","Consolas","Liberation Mono",monospace}
  /* the opening : the instrument wakes up together with the city */
  @keyframes uiIn{from{opacity:0}to{opacity:1}}
  body.intro #ui{opacity:0;animation:uiIn 1.05s ease-out 1.30s forwards}
body.intro #band{opacity:0;animation:uiIn 1.05s ease-out 1.30s forwards}

  /* ---- framing marks : the frame is a viewfinder now, not a bezel ----
     Four short marks in the corners of the picture, the way a camera frames
     a shot.  The bezel is gone : the instrument looks out, it does not sit
     on top of the view. */
  .ui-corner{position:absolute;width:17px;height:17px;opacity:.42;
      border-color:rgba(198,214,244,.62);border-style:solid}
  .ui-corner.tl{left:22px;top:22px;border-width:1px 0 0 1px}
  .ui-corner.tr{right:22px;top:22px;border-width:1px 1px 0 0}
  /* the two bottom corners stand clear of the readout band : a viewfinder
     mark lying across the state chip is the one overlap this frame must not
     have, and the band is the instrument, not the picture */
  .ui-corner.bl{left:22px;bottom:calc(var(--band,56px) + 13px);border-width:0 0 1px 1px}
  .ui-corner.br{right:22px;bottom:calc(var(--band,56px) + 13px);border-width:0 1px 1px 0}

  /* ---- datum line : the sea's zero, ruled like an instrument ---- */
  .ui-horizon{position:absolute;left:0;right:0;height:1px;
      background:linear-gradient(90deg,transparent,rgba(198,214,244,.26) 10%,
                 rgba(198,214,244,.26) 90%,transparent)}
  .ui-hz-ticks{position:absolute;left:0;right:0;top:0;height:4px;
      background-image:repeating-linear-gradient(90deg,
                 rgba(198,214,244,.40) 0 1px,transparent 1px 5%),
                 repeating-linear-gradient(90deg,
                 rgba(120,150,225,.32) 0 1px,transparent 1px 1.25%)}
  /* the datum is labelled at its far end : the middle of the frame belongs
     to the sun, and the sun is the subject */
  .ui-hz-lbl{position:absolute;right:4vw;right:clamp(26px,4vw,68px);top:-17px;
      font:500 8px/1 "SFMono-Regular",Consolas,monospace;letter-spacing:.32em;
      color:rgba(198,214,244,.52);white-space:nowrap}

  /* ---- acquisition reticle on the sun ----
     An instrument that is locked on never sits perfectly still : the outer
     rings breathe on two different clocks, the dial creeps round, one pip
     chases it, the rim picks up stray noise, and the crosshair is carried
     by a sensor that never quite stops trembling. */
  .ui-reticle{position:absolute;width:var(--rr,90px);height:var(--rr,90px);
      transform:translate(-50%,-50%)}
  .ui-reticle i{position:absolute;inset:0;border:1px dashed rgba(198,214,244,.30);
      border-radius:50%}
  .ui-reticle s{position:absolute;background:rgba(198,214,244,.52)}
  .ui-reticle s.t{left:50%;top:-10px;width:1px;height:8px;margin-left:-.5px}
  .ui-reticle s.b{left:50%;bottom:-10px;width:1px;height:8px;margin-left:-.5px}
  .ui-reticle s.l{top:50%;left:-10px;height:1px;width:8px;margin-top:-.5px}
  .ui-reticle s.r{top:50%;right:-10px;height:1px;width:8px;margin-top:-.5px}
  .ui-reticle em{position:absolute;left:50%;top:50%;width:22px;height:22px;
      margin:-11px 0 0 -11px;opacity:.7;
      background:linear-gradient(rgba(255,96,152,.88),rgba(255,96,152,.88)) center/1px 100% no-repeat,
                 linear-gradient(rgba(255,96,152,.88),rgba(255,96,152,.88)) center/100% 1px no-repeat}

  /* --- the breathing ring : one slow pulse, and a second one that never
         lines up with it, so the loop is never readable as a loop --- */
  @keyframes rrBreath{
      0%,100%{transform:scale(.962);opacity:.90}
      50%    {transform:scale(1.058);opacity:.28}}
  @keyframes rrBreath2{
      0%,100%{transform:scale(1.050);opacity:.20}
      50%    {transform:scale(.952);opacity:.78}}
  .ui-reticle>b{position:absolute;inset:calc(var(--rr,90px)*-.145);
      border-radius:50%;font-weight:400;
      border:1px solid rgba(255,96,152,.30);
      box-shadow:0 0 14px rgba(255,96,152,.13),inset 0 0 12px rgba(255,96,152,.09);
      animation:rrBreath 4.6s cubic-bezier(.45,0,.55,1) infinite}
  .ui-reticle>b::after{content:"";position:absolute;
      inset:calc(var(--rr,90px)*.062);border-radius:50%;
      border:1px solid rgba(198,214,244,.20);
      animation:rrBreath2 7.3s cubic-bezier(.45,0,.55,1) infinite}

  /* --- the bearing dial : a tick every five degrees, long marks at the
         quadrants.  The rim carries no lettering : a dial that spells out
         its cardinals is a chart, and this is an instrument. --- */
  @keyframes rrSpin{to{transform:rotate(360deg)}}
  .ui-reticle>u{position:absolute;inset:calc(var(--rr,90px)*-.30);
      border-radius:50%;text-decoration:none}
  .ui-reticle>u::before{content:"";position:absolute;inset:0;border-radius:50%;
      background-image:repeating-conic-gradient(from -0.35deg,
          rgba(198,214,244,.46) 0deg .55deg,transparent .55deg 5deg,
          rgba(198,214,244,.11) 5deg 5.35deg,transparent 5.35deg 10deg);
      -webkit-mask-image:radial-gradient(circle closest-side,
          transparent 0 92.4%,#000 93.0% 96.2%,transparent 96.6%);
      mask-image:radial-gradient(circle closest-side,
          transparent 0 92.4%,#000 93.0% 96.2%,transparent 96.6%);
      opacity:.60;animation:rrSpin 46s linear infinite}
  .ui-reticle>u::after{content:"";position:absolute;inset:0;border-radius:50%;
      background-image:
        linear-gradient(90deg,transparent calc(50% - 1px),rgba(255,96,152,.60) calc(50% - 1px),
          rgba(255,96,152,.60) calc(50% + 1px),transparent calc(50% + 1px)),
        linear-gradient(0deg,transparent calc(50% - 1px),rgba(255,96,152,.60) calc(50% - 1px),
          rgba(255,96,152,.60) calc(50% + 1px),transparent calc(50% + 1px));
      -webkit-mask-image:radial-gradient(circle closest-side,
          transparent 0 91%,#000 91.6% 97.2%,transparent 97.6%);
      mask-image:radial-gradient(circle closest-side,
          transparent 0 91%,#000 91.6% 97.2%,transparent 97.6%)}

  /* --- the sweep : a single pip chasing the dial, dragging a short wake.
         It is an instrument idling, not a radar : it turns once every
         half a minute and it is barely brighter than the glass. --- */
  .ui-reticle>var{position:absolute;inset:calc(var(--rr,90px)*-.145);
      font-style:normal;animation:rrSpin 27s linear infinite}
  .ui-reticle>var::before{content:"";position:absolute;left:50%;top:0;
      width:1px;height:100%;margin-left:-.5px;
      background:linear-gradient(rgba(214,226,250,.26),rgba(255,96,152,.10) 42%,
                 rgba(255,96,152,0) 100%);
      transform-origin:50% 100%}
  .ui-reticle>var::after{content:"";position:absolute;left:50%;top:-1px;
      width:2px;height:2px;margin-left:-1px;border-radius:50%;
      background:rgba(214,226,250,.42);box-shadow:0 0 4px rgba(255,96,152,.45)}

  /* --- rim noise : stray grains the glass keeps picking up --- */
  @keyframes nzFlick{
      0%,100%{opacity:.05}20%{opacity:.82}44%{opacity:.12}
      70%{opacity:.95}86%{opacity:.30}}
  .ui-reticle .nz{position:absolute;inset:calc(var(--rr,90px)*-.30)}
  .ui-reticle .nz u{position:absolute;width:1.4px;height:1.4px;margin:-.7px 0 0 -.7px;
      border-radius:50%;text-decoration:none;
      background:rgba(198,214,244,.85);
      animation:nzFlick var(--t,3s) ease-in-out infinite;
      animation-delay:var(--d,0s)}

  /* --- sensor noise : the cross is held by a real sensor, and the sensor
         is never quite still. steps() keeps the twitch abrupt, the way a
         bad fix jumps, rather than drifting smoothly. --- */
  @keyframes rrJit{
      0%{transform:translate(0,0)}
      7%{transform:translate(.55px,-.35px)}
      13%{transform:translate(-.30px,-.70px)}
      21%{transform:translate(.70px,.45px)}
      29%{transform:translate(-.60px,.25px)}
      37%{transform:translate(.25px,-.55px)}
      44%{transform:translate(-.45px,.65px)}
      52%{transform:translate(.60px,-.25px)}
      61%{transform:translate(-.25px,-.45px)}
      69%{transform:translate(.40px,.60px)}
      77%{transform:translate(-.70px,.15px)}
      85%{transform:translate(.35px,-.40px)}
      93%{transform:translate(-.15px,.50px)}
      100%{transform:translate(0,0)}}
  .ui-reticle>s,.ui-reticle>em{animation:rrJit 4.7s steps(1,end) infinite}
  @media (prefers-reduced-motion:reduce){
    .ui-reticle>b,.ui-reticle>b::after,.ui-reticle>u::before,
    .ui-reticle>var,.ui-reticle .nz u,.ui-reticle>s,.ui-reticle>em{animation:none}
  }

  /* ---- bearing marker : where the sun stands on the datum line ----
     The sun walks, so the bearing changes, and the number is true while
     you watch it. */
  .ui-hz-sun{position:absolute;top:-6px;width:1px;height:13px;
      background:rgba(255,96,152,.88)}
  .ui-hz-sun::after{content:attr(data-az);position:absolute;right:7px;top:0;
      font:500 7.5px/1 "SFMono-Regular",Consolas,monospace;letter-spacing:.24em;
      color:rgba(255,120,170,.80);white-space:nowrap;text-align:right}

  /* ---- the tide staff : the only part of the instrument that moves ----
     A ruler standing on the beach.  The mark on it is the water, and it
     goes down the scale as the tide comes up the sand.  The number beside
     it is read off the same curve as the picture, so the two can never
     disagree with each other. */
  .ui-gauge{position:absolute;left:4vw;left:clamp(26px,4vw,68px);top:48%;bottom:10%;width:1px;
      opacity:.62;background:linear-gradient(180deg,
                 transparent,rgba(198,214,244,.24) 7%,rgba(198,214,244,.24) 93%,transparent)}
  .ui-gauge i{position:absolute;left:-4px;width:9px;height:1px;
      background:rgba(198,214,244,.30)}
  .ui-gauge b{position:absolute;left:-1.5px;width:3px;height:3px;margin-top:-1.5px;
      border-radius:50%;background:rgba(255,96,152,.95);
      box-shadow:0 0 8px rgba(255,96,152,.60)}
  .ui-gauge u{position:absolute;left:13px;top:0;margin-top:-4px;text-decoration:none;
      font:500 7.5px/1 "SFMono-Regular",Consolas,monospace;letter-spacing:.20em;
      color:rgba(255,120,170,.90);white-space:nowrap;
      text-shadow:0 0 8px rgba(2,5,9,.95)}

  /* ---- title block ---- */
  .ui-brand{position:absolute;left:4vw;left:clamp(26px,4vw,68px);top:4.6vh;top:clamp(24px,4.6vh,52px);
      display:block}
  /* a horizontal rule, never a vertical one : a bright vertical line above
     the left towers read as one more building */
  .ui-mark{width:24px;height:1px;margin:0 0 11px;background:rgba(198,214,244,.85)}
  .ui-mark::after{content:"";display:block;width:6px;height:1px;
      background:rgba(198,214,244,.42);margin:5px 0 0 18px}  .ui-kicker,.ui-meta,#band .cell{
    font:500 8.5px/1.6 "SFMono-Regular","Consolas","Liberation Mono",monospace;
    letter-spacing:.26em;text-transform:uppercase}
  .ui-kicker{color:rgba(198,214,244,.60);margin:0 0 8px}
  .ui-title{font:300 15px/1 "Arial Narrow","Helvetica Neue",sans-serif;
      font:300 clamp(15px,1.62vw,21px)/1 "Arial Narrow","Helvetica Neue",sans-serif;
      letter-spacing:.26em;text-transform:uppercase;white-space:nowrap;
      color:rgba(240,233,238,.88);margin:0}
  .ui-title span{font-weight:400;color:rgba(255,96,152,.96)}

  /* ---- the readout band : every number in the piece stands here ----
     One strip at the foot of the frame carries the state of the instrument,
     where the observer stands, what the sea is doing, and the one sentence
     that speaks.  Nothing else gets a corner of the picture. */
  #band{position:absolute;left:0;right:0;bottom:0;z-index:5;height:var(--band,56px);
      pointer-events:none;display:flex;align-items:center;overflow:hidden;
      padding:0 4vw;padding:0 clamp(26px,4vw,68px);
      background:linear-gradient(180deg,transparent,rgba(2,5,9,.44) 34%,rgba(2,5,9,.86));
      border-top:1px solid rgba(198,214,244,.10);
      font-family:"SFMono-Regular","Consolas","Liberation Mono",monospace}
  #band .cell{display:flex;align-items:baseline;flex:0 0 auto;
      padding:0 2.2vw;padding:0 clamp(14px,2.2vw,32px);
      border-left:1px solid rgba(198,214,244,.12);
      font:500 8.5px/1 "SFMono-Regular","Consolas","Liberation Mono",monospace;
      letter-spacing:.22em;text-transform:uppercase;
      color:rgba(198,214,244,.80);white-space:nowrap}
  #band .cell > * + *{margin-left:9px}
  #band .cell:first-child{border-left:0;padding-left:0}
  #band .cell b{font-weight:500;letter-spacing:.22em;color:rgba(120,150,225,.82)}
  #band .cell.st{color:rgba(198,214,244,.88)}
  #band .cell.st i{width:7px;height:7px;border:1px solid rgba(198,214,244,.90);
      border-radius:50%;align-self:center;animation:signal 3.7s ease-in-out infinite}
  #band .cell.say{flex:1 1 0;min-width:0;text-transform:none;letter-spacing:.04em;
      font-size:11px;color:rgba(214,226,250,.96);
      text-shadow:0 0 10px rgba(2,5,9,.95),0 0 3px rgba(2,5,9,.9)}
  /* the sentence is the one thing in the band that may be long : it gives
     up its tail rather than push the reading beside it off the frame */
  #band .cell.say>span{display:block;min-width:0;overflow:hidden;
      text-overflow:ellipsis;white-space:nowrap}

  /* ---- the sentence speaks in its own voice ----
     It is the only prose in the piece and it stands on the sand, so it has
     to carry its own contrast : a dark halo behind it keeps it readable
     when the water comes up and the sand goes bright. */
  #ui-status{text-transform:none;letter-spacing:.05em;font-size:11px;
      color:rgba(214,226,250,.96);
      font-family:"SFMono-Regular","Consolas","Liberation Mono",
        "Microsoft YaHei","PingFang SC","Hiragino Sans GB","Noto Sans SC",monospace;
      text-shadow:0 0 10px rgba(2,5,9,.95),0 0 3px rgba(2,5,9,.9)}

  /* the pip breathes on its own clock, 3.7s : the reticle's ring breathes
     on 4.6s, and two lamps on the same period look like one lamp blinking
     twice rather than two lamps alive */
  @keyframes signal{0%,100%{opacity:.42;transform:scale(.88)}50%{opacity:1;transform:scale(1)}}
  /* the sentence is also spoken to the screen readers, which cannot see a
     projection */
  .sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
      clip:rect(0 0 0 0);white-space:nowrap;border:0}
  #boot{position:absolute;inset:0;z-index:20;background:#04070b;
        display:grid;place-items:center;transition:opacity .45s ease}
  #boot i{display:block;width:130px;height:1px;
        background:linear-gradient(90deg,rgba(198,214,244,0),rgba(198,214,244,.60),rgba(198,214,244,0));
        animation:bl 1.8s ease-in-out infinite}
  @keyframes bl{0%,100%{opacity:.12;transform:scaleX(.45)}50%{opacity:.85;transform:scaleX(1)}}
  #boot.gone{opacity:0;pointer-events:none}
  @media (max-width:700px){
    /* The phone keeps the instrument : the datum and its label stay, the
       staff goes (the writing needs the room), and the band drops the two
       readings it cannot afford. */
    #stage{--band:46px}
    .ui-gauge,#band .cell.lat,#band .cell.lon{display:none}
    .ui-title{font-size:15px;letter-spacing:.30em}
    #band{height:var(--band,46px);padding:0 14px}
    #band .cell{padding:0 12px;font-size:8px;letter-spacing:.16em}
    #band .cell.say,#band .cell.say>span,#ui-status{font-size:9px;letter-spacing:0}
    #band .cell.tide .dir{display:none}
    .ui-corner{width:14px;height:14px;opacity:.34}
    .ui-hz-lbl{font-size:7px;letter-spacing:.22em;top:-13px}
  }

  /* Chrome 61 baseline: physical edge offsets for the WebView that predates inset. */
  #stage,#scrim,#ui,#boot,
  .ui-reticle i,.ui-reticle>u::before,.ui-reticle>u::after{
    top:0;right:0;bottom:0;left:0;
  }
  .ui-reticle>b{
    top:calc(var(--rr,90px)*-.145);right:calc(var(--rr,90px)*-.145);
    bottom:calc(var(--rr,90px)*-.145);left:calc(var(--rr,90px)*-.145);
  }
  .ui-reticle>b::after{
    top:calc(var(--rr,90px)*.062);right:calc(var(--rr,90px)*.062);
    bottom:calc(var(--rr,90px)*.062);left:calc(var(--rr,90px)*.062);
  }
  .ui-reticle>u,.ui-reticle .nz{
    top:calc(var(--rr,90px)*-.30);right:calc(var(--rr,90px)*-.30);
    bottom:calc(var(--rr,90px)*-.30);left:calc(var(--rr,90px)*-.30);
  }
  .ui-reticle>var{
    top:calc(var(--rr,90px)*-.145);right:calc(var(--rr,90px)*-.145);
    bottom:calc(var(--rr,90px)*-.145);left:calc(var(--rr,90px)*-.145);
  }

  /* Safe areas are layered on top only where env() is available; the baseline
     above remains usable in Chrome 61 even when the container injects nothing. */
  @supports (padding-bottom:env(safe-area-inset-bottom)){
    .ui-brand{
      top:calc(clamp(24px,4.6vh,52px) + var(--safe-area-inset-top,env(safe-area-inset-top,0px)));
    }
    .ui-corner.tl,.ui-corner.tr{
      top:calc(22px + var(--safe-area-inset-top,env(safe-area-inset-top,0px)));
    }
    .ui-corner.bl,.ui-corner.br{
      bottom:calc(var(--band,56px) + 13px + var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)));
    }
    #band{
      height:calc(var(--band,56px) + var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)));
      padding-bottom:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px));
    }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <div id="scrim"></div>
  <div id="ui" aria-hidden="true">
    <span class="ui-corner tl"></span><span class="ui-corner tr"></span>
    <span class="ui-corner bl"></span><span class="ui-corner br"></span>

    <div class="ui-gauge">
      <i style="top:0"></i><i style="top:20%"></i><i style="top:40%"></i>
      <i style="top:60%"></i><i style="top:80%"></i><i style="top:100%"></i>
      <b id="ui-gauge-mark"></b>
      <u id="ui-gauge-read">0.00 M</u>
    </div>

    <div class="ui-horizon">
      <div class="ui-hz-ticks"></div>
      <div class="ui-hz-lbl">EL 0.000 &nbsp;/&nbsp; SEA DATUM</div>
      <span class="ui-hz-sun"></span>
    </div>

    <div class="ui-reticle">
      <b></b>
      <u></u>
      <var></var><i></i><div class="nz"></div>
      <s class="t"></s><s class="b"></s>
      <s class="l"></s><s class="r"></s><em></em>
    </div>

    <div class="ui-brand">
      <span class="ui-mark"></span>
      <div>
        <p class="ui-kicker">TE-0306 / coastal signal archive</p>
        <h1 class="ui-title">SUMMON THE <span>SEA GOD</span></h1>
      </div>
    </div>
  </div>
  <div id="band" aria-hidden="true">
    <div class="cell st"><i></i><span id="ui-state">IDLE</span></div>
    <div class="cell lat"><b>LAT</b><span>31.2304 N</span></div>
    <div class="cell lon"><b>LON</b><span>121.4737 E</span></div>
    <div class="cell tide"><b>TIDE</b><span id="ui-tide">04.7 M</span><span id="ui-tide-dir" class="dir"></span></div>
    <div class="cell say"><span id="ui-status">The sea is calm</span></div>
  </div>
  <div id="live" class="sr" aria-live="polite"></div>
  <div id="boot"><i></i></div>
</div>
<canvas id="ink" style="display:none"></canvas>

<script src="./app.js"></script>
</body>
</html>
